   +netBlock([{label:'Pleine propriété reconstituée',value:full,kind:'total'},{label:'Frais de revente',value:-(full*v.fs/100),kind:'delta'},{label:'Valeur nette de frais',value:exit,kind:'total'},{label:'Impôt sur la plus-value',value:-pvT,kind:'delta'},{label:'Net après impôt',value:net,kind:'total'}])
   +ui.card('Valeur de la position pendant le démembrement (progression linéaire)',lineChart({labels,series:[{name:'Valeur de la nue-propriété',values:vals},{name:'Montant payé',values:vals.map(()=>v.m),dash:'5 4'}],yMin0:true}))
   +ui.note('La décote rémunère l’absence de loyers pendant le démembrement. Avantages : pas d’impôt sur le revenu ni d’IFI pendant la période. Risques : baisse du prix de part, illiquidité, frais à la revente. Le nu-propriétaire récupère la pleine propriété à l’extinction de l’usufruit, sans impôt à ce moment.')}
  const m=v.m,y1=(12-v.dj)/12;let prix=m,cash=0,impots=0,fraisC=0,loyTot=0;const labels=[],val=[],cumN=[],flows=[-m],rows=[],tot=[];
  for(let t=0;t<=v.n;t++){labels.push('An '+t);val.push(prix*(1-v.fs/100)*(v.mode==='av'?1:1));cumN.push(cash);
   if(t===v.n)break;
   const loy=m*v.td/100*(t===0?y1:1)*(v.mode==='av'?v.rev/100:1);loyTot+=loy;
   if(v.mode==='direct'){const fr=loy*(1-v.etr/100),et=loy*v.etr/100,tx=fr*(v.tmi/100+TAX.psImmo)+et*(v.tetr/100+v.psetr);impots+=tx;cash+=loy-tx;flows.push(loy-tx);rows.push([t+1,E(loy),E(tx),E(loy-tx),E(prix*(1+v.reval/100)*(1-v.fs/100))])}
   else{const parts=prix*(1-v.fs/100),fr=(parts+cash)*v.fav/100;fraisC+=fr;cash=cash*(1+v.reinv/100)+loy-fr;flows.push(0);rows.push([t+1,E(loy),'—',E(loy-fr),E(parts*(1+v.reval/100)+cash)])}
   prix*=1+v.reval/100}
  const sortieParts=prix*(1-v.fs/100);let final,avT=0,pvT=0,tri;
  if(v.mode==='av'){const valC=sortieParts+cash,g=Math.max(0,valC-m);avT=avTax(g,m,v.n,v.sit===2,false,0).total;final=valC-avT;flows[flows.length-1]+=final}
  else{const [aI,aP]=pvAbat(v.n),pv=Math.max(0,sortieParts-m);pvT=pv*(1-aI)*TAX.pvImmoIR+pv*(1-aP)*TAX.psImmo;final=sortieParts-pvT;flows[flows.length-1]+=final}
  tri=irr(flows);const total=v.mode==='av'?final:cash+final;
  return ui.card('',ui.kpis([['Montant payé / parts à la souscription (nettes de frais)',E(m)+' / '+E(m*(1-v.fs/100))],['Loyers bruts, 1ʳᵉ année pleine',E(m*v.td/100)+' ('+P(v.td,2)+')'],v.mode==='direct'?['Impôt sur les loyers (cumulé)',E(impots)]:['Frais du contrat (cumulés)',E(fraisC)],v.mode==='direct'?['Loyers nets cumulés',E(cash)]:['Impôt au rachat (assurance-vie)',E(avT)],['Valeur de sortie des parts (prix de retrait)',E(sortieParts)],['Total récupéré net',E(total),'hi'],['Gain ou perte net',`<span class="${total>=m?'good':'bad'}">${sgn(total-m)}</span>`],['Rendement annualisé net (TRI)',`<span class="${tri>=0?'good':'bad'}">${P(tri,2)}</span>`]]))
  +netBlock(v.mode==='direct'?[{label:'Total brut (loyers + parts)',value:loyTot+prix,kind:'total'},{label:'Frais de souscription',value:-prix*v.fs/100,kind:'delta'},{label:'Loyers et parts nets de frais',value:loyTot+sortieParts,kind:'total'},{label:'Impôts (loyers et plus-value)',value:-(impots+pvT),kind:'delta'},{label:'Total net récupéré',value:total,kind:'total'}]:[{label:'Total brut',value:prix+cash+fraisC,kind:'total'},{label:'Frais de souscription',value:-prix*v.fs/100,kind:'delta'},{label:'Frais du contrat',value:-fraisC,kind:'delta'},{label:'Valeur du contrat',value:sortieParts+cash,kind:'total'},{label:'Impôt au rachat',value:-avT,kind:'delta'},{label:'Total net récupéré',value:total,kind:'total'}],'Du brut au net : frais de souscription, frais du contrat et impôt')
  +ui.card(v.mode==='direct'?'Valeur de retrait des parts et loyers nets cumulés':'Valeur du contrat (parts + loyers capitalisés)',lineChart({labels,series:v.mode==='direct'?[{name:'Valeur de retrait des parts',values:val},{name:'Loyers nets cumulés',values:cumN,color:COLS[1]},{name:'Total',values:val.map((x,i)=>x+cumN[i]),color:COLS[4],dash:'5 4'},{name:'Montant payé',values:val.map(()=>m),color:'#888',dash:'2 4'}]:[{name:'Valeur du contrat',values:val.map((x,i)=>x+cumN[i])},{name:'Montant payé',values:val.map(()=>m),dash:'5 4'}],yMin0:true}))
  +ui.card('Année par année',ui.table(['Année','Loyers bruts','Impôt','Loyers nets (après impôt ou frais)','Valeur de sortie '+(v.mode==='av'?'du contrat':'des parts')],rows))
  +ui.card('Fiscalité selon le mode',ui.table(['Mode','Loyers','Sortie','IFI'],[['Direct','Revenus fonciers : barème (TMI '+v.tmi+' %) + 17,2 % de prélèvements sociaux ; part étrangère imposée dans le pays de l’immeuble','Plus-value immobilière : 19 % + 17,2 % avec abattements (exonération après 22 et 30 ans)','Dans l’assiette'],['Assurance-vie','Capitalisés sans impôt ; frais de contrat '+P(v.fav,2),'Fiscalité de l’assurance-vie au rachat','Dans l’assiette'],['Nue-propriété','Aucun pendant le démembrement','Pleine propriété reconstituée au terme','Hors assiette']]))
  +ui.note('Simplifications : distribution constante en euros, frais de souscription supportés à la sortie (prix de retrait = prix de souscription × (1 − frais)), pas de plus-values de cession dans les loyers. Le TRI du mode direct suppose que les loyers sont perçus ; celui du mode assurance-vie inclut leur capitalisation. La liquidité dépend de la contrepartie.')},
 faq:[['Pourquoi le rendement affiché est-il plus bas que le taux de distribution ?','Parce que le client a payé 8 à 12 % de frais d’entrée que le prix de retrait ne rend pas, parce que le prix de la part peut baisser (−3,45 % en 2025), et parce que les loyers sont taxés.'],['Pendant combien de temps garder une SCPI ?','8 à 10 ans au moins : il faut amortir les frais d’entrée. Pour un besoin de liquidité à moins de 5 ans, ce n’est pas le bon outil.'],['Direct ou assurance-vie ?','En direct, les loyers sont taxés chaque année (TMI + 17,2 %). En assurance-vie, ils sont capitalisés sans impôt annuel, avec des frais de contrat et l’impôt de l’assurance-vie au rachat.'],['Qu’est-ce que la nue-propriété ?','Le client achète la nue-propriété avec une décote ; l’usufruit est cédé pour une durée. À la fin, il récupère la pleine propriété sans impôt : pas de loyer, mais pas d’impôt ni d’IFI pendant la période.'],['Les SCPI comptent-elles dans l’IFI ?','Oui, en direct comme en assurance-vie (parts d’unités de compte immobilières). La nue-propriété, elle, est hors assiette pour le nu-propriétaire.'],['Est-ce liquide ?','Non : le retrait dépend de la contrepartie et des files d’attente peuvent apparaître.']],
 formulas:["<b>Loyers annuels</b> = montant payé × taux de distribution ; 1ʳᵉ année × (12 − délai de jouissance) ÷ 12.", "<b>Impôt direct</b> = loyers France × (TMI + 17,2 %) + loyers étrangers × (impôt étranger + prélèvements sociaux choisis).", "<b>Valeur de retrait</b> = prix de souscription × (1 + variation annuelle)<sup>n</sup> × (1 − frais de souscription).", "<b>Assurance-vie</b> : loyers reversés capitalisés au rendement choisi ; frais de contrat = taux × (parts + loyers capitalisés) chaque année ; impôt au rachat selon la formule de l’assurance-vie.", "<b>Nue-propriété</b> : pleine propriété = prix payé ÷ (1 − décote) ; au terme, valeur = pleine propriété × (1 + variation)<sup>durée</sup> × (1 − frais) ; impôt de plus-value avec abattements.", "<b>TRI</b> : le taux r tel que −montant payé + Σ flux<sub>t</sub> ÷ (1 + r)<sup>t</sup> = 0 (résolu par dichotomie)."],
 when:{"td": "v.mode!=='np'", "dj": "v.mode!=='np'", "n": "v.mode!=='np'", "tmi": "v.mode==='direct'", "etr": "v.mode==='direct'", "tetr": "v.mode==='direct'&&v.etr>0", "psetr": "v.mode==='direct'&&v.etr>0", "fav": "v.mode==='av'", "rev": "v.mode==='av'", "reinv": "v.mode==='av'", "sit": "v.mode==='av'", "decote": "v.mode==='np'", "dnp": "v.mode==='np'"},
 watch:['Prélèvements sociaux sur les loyers de source étrangère : selon la documentation officielle (Service-Public), un résident fiscal français est soumis aux prélèvements sociaux sur ses revenus du patrimoine ; seules les personnes affiliées à un régime obligatoire de sécurité sociale d’un autre pays de l’EEE ou de la Suisse sont exonérées de CSG et de CRDS, le prélèvement de solidarité de 7,5 % restant dû.','Taux de distribution et variations de prix : propres à chaque SCPI et à chaque année.']});


const JEAN=[['Neuf, loyer intermédiaire (3,5 %, max 8 000 €)',.035,8000],['Neuf, loyer social (4,5 %, max 10 000 €)',.045,10000],['Neuf, loyer très social (5,5 %, max 12 000 €)',.055,12000],['Ancien rénové, intermédiaire (3 %, max 10 700 €)',.03,10700],['Ancien rénové, social (3,5 %, max 10 700 €)',.035,10700],['Ancien rénové, très social (4 %, max 10 700 €)',.04,10700]];
function locSim(v,l){
  const cout=v.prix*(1+v.fn/100)+v.trav,emp=Math.max(0,cout-v.app),r=v.t/1200,N_=v.n*12,M=pmt(emp,r,N_);
  let k=emp,report=0,cum=0,amortTot=0,gest=0,sumNet=0;const rows=[],cf=[],cumA=[0];const jv=JEAN[v.jv||0];
  for(let y=1;y<=v.h;y++){let I=0;for(let mth=0;mth<12;mth++){if((y-1)*12+mth<N_&&k>0){const i=k*r;I+=i;k-=Math.min(M-i,k)}}
   const g=Math.pow(1+v.idx/100,y-1),loyA=l*12*(1-v.vac/100)*g,chY=v.ch*g+loyA*(v.fgl||0)/100,debt=y<=v.n?M*12:0;gest+=loyA*(v.fgl||0)/100;let tax=0,base=0,note='';
   const reelFoncier=(R1)=>{let t;if(R1<0){const dg=Math.min(-R1,10700);report+=(-R1-dg)+I;t=-dg*v.tmi/100;note='Déficit'}else{const net=R1-I;if(net<0){report+=-net;t=0}else{const use=Math.min(report,net);report-=use;t=(net-use)*(v.tmi/100+TAX.psImmo)}}return t};
   if(v.reg==='micro'&&loyA<=15000){base=loyA*.7;tax=base*(v.tmi/100+TAX.psImmo)}
   else if(v.reg==='micro'||v.reg==='reel'){tax=reelFoncier(loyA-chY-(y===1?v.trav:0))}
   else if(v.reg==='microbic'){base=loyA*.5;tax=base*(v.tmi/100+TAX.ps)}
   else if(v.reg==='lmnp'){const am=cout*.85/30+(y<=10?v.trav*.15/10:0);amortTot+=Math.min(am,Math.max(0,loyA-chY-I));base=Math.max(0,loyA-chY-I-am);tax=base*(v.tmi/100+TAX.ps)}
   else{const am=Math.min(v.prix*jv[1],jv[2]);amortTot+=am;tax=reelFoncier(loyA-chY-am-(y===1?v.trav:0))}
   const net=loyA-chY-debt-tax;sumNet+=loyA-chY-tax;cum+=net;cf.push(net);cumA.push(cum);rows.push([y,E(loyA),E(chY),E(I),E(debt),E(tax),E(net)])}
  return {cf,cum,cumA,rows,rest:Math.max(0,k),cout,emp,M,amortTot,gest,sumNet,mean:cum/v.h/12}}
SIMS.push({id:'locatif',grp:'Immobilier',name:'Immobilier locatif : cash-flow, régime fiscal, rendement',lead:'Loyers, charges, crédit et impôt : ce qu’il reste chaque mois selon le régime, et le loyer qui équilibre l’opération.',

 ctl:v=>'<div class="fld" data-presets></div>'+ui.sl('prix','Prix du bien (hors frais)',30000,3000000,1000,280000,' €')+ui.sl('fn','Frais de notaire et d’acquisition',0,12,.1,7.5,' %','7 à 8 % dans l’ancien, 2 à 3 % dans le neuf.')+ui.sl('trav','Travaux',0,500000,1000,0,' €')+ui.sl('loyer','Loyer mensuel hors charges',100,10000,10,1100,' €')+ui.sl('vac','Vacance et impayés',0,20,.5,5,' %')+ui.sl('ch','Charges annuelles non récupérables (taxe foncière, copropriété, gestion, assurance)',0,30000,100,3000,' €')+ui.sl('fgl','Frais de gestion locative (% des loyers encaissés)',0,15,.1,0,' %','À saisir selon le mandat de gestion.')+ui.sl('idx','Évolution annuelle des loyers et charges',-1,5,.1,1,' %')+ui.sl('app','Apport',0,2000000,1000,30000,' €')+ui.sl('t','Taux du crédit',0,8,.01,3.4,' %')+ui.sl('n','Durée du crédit',1,40,1,20,' ans')+ui.sl('tmi','TMI',0,45,1,30,' %')+ui.sel('reg','Régime fiscal',[['micro','Micro-foncier (abattement 30 %, loyers ≤ 15 000 €)'],['reel','Réel, location nue (déficit foncier)'],['microbic','Micro-BIC meublé (abattement 50 %)'],['lmnp','LMNP réel (amortissement)'],['jean','Jeanbrun (location nue, amortissement)']],'reel')+ui.sel('jv','Jeanbrun : type de bien et de loyer',JEAN.map((j,i)=>[i,j[0]]),0)+ui.sl('reval','Revalorisation annuelle du bien',-5,6,.1,1,' %')+ui.sl('fv','Frais de revente (agence, diagnostics)',0,10,.1,0,' %')+ui.sl('h','Horizon de revente',1,40,1,15,' ans'),
 calc:v=>{const s=locSim(v,v.loyer),cout=s.cout,loyA1=v.loyer*12*(1-v.vac/100);
  const valeur=(v.prix+v.trav)*Math.pow(1+v.reval/100,v.h),[aI,aP]=pvAbat(v.h);
  const pvBrute=valeur*(1-v.fv/100)-cout+((v.reg==='lmnp'||v.reg==='jean')?s.amortTot:0),pv=Math.max(0,pvBrute),pvIR=pv*(1-aI),pvT=pvIR*TAX.pvImmoIR+pv*(1-aP)*TAX.psImmo;
  const net=valeur*(1-v.fv/100)-s.rest-pvT,fin=s.cum+net-v.app,flows=[-v.app,...s.cf];flows[flows.length-1]+=net;const tri=irr(flows);
  // loyer d'équilibre
  let lo=0,hi=Math.max(1000,v.loyer*8);for(let i=0;i<50;i++){const mid=(lo+hi)/2;if(locSim(v,mid).mean<0)lo=mid;else hi=mid}const eq=(lo+hi)/2;
  const notes=[];if(v.reg==='micro'&&loyA1>15000)notes.push('Les loyers dépassent 15 000 € : le micro-foncier n’est pas ouvert, la simulation applique le régime réel.');if(pvIR>50000)notes.push('La plus-value nette imposable dépasse 50 000 € : une surtaxe de 2 à 6 % s’ajoute (non calculée ici).');if(v.reg==='jean')notes.push('Dispositif Jeanbrun : engagement de location nue de 9 ans à loyer plafonné, acquisitions entre le 21 février 2026 et le 31 décembre 2028 ; les amortissements déduits sont réintégrés dans la plus-value à la revente (article 150 VB III du CGI, version en vigueur depuis le 21 février 2026).');
  return ui.card('',ui.kpis([['Rendement brut',P(v.loyer*12/cout*100,2)],['Rendement net de charges et de gestion',P((loyA1*(1-(v.fgl||0)/100)-v.ch)/cout*100,2)],['Rendement net après impôt (moyenne annuelle)',P(s.sumNet/v.h/cout*100,2)],['Frais de gestion locative cumulés',E(s.gest)],['Frais de revente',E(valeur*v.fv/100)],['Mensualité du crédit',E(s.M)],['Cash-flow mensuel moyen (après impôt)',`<span class="${s.mean>=0?'good':'bad'}">${E(s.mean)}</span>`,'hi'],['Loyer mensuel d’équilibre (cash-flow moyen nul)',E(eq)],['Impôt sur la plus-value à la revente',E(pvT)],['Valeur nette à la revente (après dette et impôt)',E(net)],['Enrichissement total sur '+v.h+' ans (hors apport)',`<span class="${fin>=0?'good':'bad'}">${sgn(fin)}</span>`],['TRI sur l’apport',P(tri,1)]]))
  +notes.map(n=>ui.warn(n)).join('')
  +ui.card('Cash-flow cumulé après impôt',lineChart({labels:s.cumA.map((_,i)=>'An '+i),series:[{name:'Cash-flow cumulé',values:s.cumA},{name:'Cash-flow de l’année',values:[0,...s.cf],color:COLS[1],dash:'5 4'}]}))
  +ui.card('Année par année',ui.table(['Année','Loyers encaissés','Charges','Intérêts','Mensualités','Impôt (− = économie)','Cash-flow'],s.rows))
  +ui.card('Détail de la revente',ui.table(['Élément','Calcul','Montant'],[['Valeur de revente','(prix + travaux) × revalorisation',E(valeur)],['Prix d’acquisition retenu','prix + frais + travaux'+((v.reg==='lmnp'||v.reg==='jean')&&s.amortTot>0?' − amortissements déduits (réintégrés)':''),E(cout-((v.reg==='lmnp'||v.reg==='jean')?s.amortTot:0))],['Frais de revente','frais saisis × valeur',E(valeur*v.fv/100)],['Plus-value brute','',E(pv)],['Abattements pour durée ('+v.h+' ans)','IR '+P(aI*100,0)+' · prélèvements sociaux '+P(aP*100,1),'—'],['Impôt','19 % × base IR + 17,2 % × base PS',E(pvT)],['Capital restant dû','',E(s.rest)],['Net de revente','valeur − dette − impôt',E(net)]],true))
  +ui.card('Ce que change le régime',ui.table(['Régime','Base imposable','Taux','À retenir'],[['Micro-foncier','70 % des loyers','TMI + 17,2 %','Loyers ≤ 15 000 € ; aucune charge déductible ; pas de déficit'],['Réel (nu)','Loyers − charges − intérêts − travaux','TMI + 17,2 %','Déficit hors intérêts imputable sur le revenu global jusqu’à 10 700 € (21 400 € pour certaines rénovations jusqu’en 2027) ; le reste et les intérêts se reportent 10 ans sur les revenus fonciers'],['Micro-BIC meublé','50 % des loyers','TMI + 18,6 %','Plafond de recettes de 83 600 € pour 2026-2028 (Service-Public Entreprendre)'],['LMNP réel','Loyers − charges − intérêts − amortissements','TMI + 18,6 % (PS)','Amortissements réintégrés dans la plus-value (cessions depuis le 15 février 2025)'],['Jeanbrun','Loyers − charges − amortissement du bien','TMI + 17,2 %','Location nue 9 ans, loyer plafonné, résidence principale du locataire']]))
  +ui.note('Simplifications : travaux déduits la 1ʳᵉ année, amortissement LMNP sur 85 % du coût en 30 ans et travaux en 10 ans, loyers et charges indexés, valeur de revente sans frais d’agence, abattements de plus-value calculés sur la durée en années révolues. Un dossier réel passe par un expert-comptable.')},
 faq:[['Combien cela va-t-il me coûter par mois ?','Le cash-flow mensuel moyen après impôt est dans le premier tableau. S’il est négatif, c’est l’effort d’épargne moyen. Le « loyer d’équilibre » donne le loyer qui ramène l’opération à zéro.'],['Quel régime choisir ?','Le micro-foncier est simple mais ne déduit rien. Le réel est avantageux avec des charges et des intérêts élevés ou des travaux. Le meublé amorti réduit l’impôt pendant la détention mais pèse à la revente. Comparer en changeant le régime.'],['Pourquoi l’impôt peut-il être négatif ?','En location nue au réel, un déficit lié aux travaux (hors intérêts) s’impute sur le revenu global jusqu’à 10 700 € par an : c’est l’économie d’impôt indiquée en négatif.'],['Que se passe-t-il à la revente ?','La plus-value est taxée (19 % + 17,2 %) avec des abattements : exonération d’impôt après 22 ans, de prélèvements sociaux après 30 ans. En meublé réel, les amortissements sont réintégrés dans la plus-value.'],['Le dispositif Jeanbrun vaut-il le coup ?','Il permet d’amortir un logement loué nu (3,5 % par an dans le neuf à loyer intermédiaire, plafonné), en échange de 9 ans de location à loyer plafonné. Simuler avec le régime « Jeanbrun » et comparer au régime réel.']],
 formulas:["<b>Loyers encaissés</b> de l’année t = loyer mensuel × 12 × (1 − vacance) × (1 + indexation)<sup>t−1</sup>.", "<b>Cash-flow</b> = loyers encaissés − charges − frais de gestion − mensualités − impôt (un impôt négatif est une économie).", "<b>Micro-foncier</b> : base = 70 % des loyers. <b>Réel nu</b> : base = loyers − charges − intérêts − travaux ; déficit hors intérêts imputable sur le revenu global jusqu’à 10 700 €, le reste et les intérêts reportables 10 ans sur les revenus fonciers.", "<b>LMNP réel</b> : base = loyers − charges − intérêts − amortissements (85 % du coût ÷ 30 ans + travaux ÷ 10) ; <b>micro-BIC</b> : base = 50 % des loyers.", "<b>Impôt</b> = base × (TMI + 17,2 %) en location nue ; base × (TMI + 18,6 %) en meublé.", "<b>Plus-value</b> = valeur de revente × (1 − frais) − (prix + frais d’acquisition + travaux) (+ amortissements déduits, réintégrés en meublé et en Jeanbrun : article 150 VB III du CGI). <b>Impôt</b> = plus-value × (1 − abattement IR) × 19 % + plus-value × (1 − abattement PS) × 17,2 %.", "<b>Abattements</b> : IR 6 %/an de la 6ᵉ à la 21ᵉ année, 4 % la 22ᵉ ; prélèvements sociaux 1,65 %/an jusqu’à la 21ᵉ, 1,60 % la 22ᵉ, 9 %/an de la 23ᵉ à la 30ᵉ.", "<b>Rendement brut</b> = loyers annuels ÷ coût d’acquisition. <b>Loyer d’équilibre</b> : loyer pour lequel le cash-flow mensuel moyen après impôt est nul (dichotomie). <b>TRI sur l’apport</b> : taux r tel que −apport + Σ cash-flow<sub>t</sub> ÷ (1 + r)<sup>t</sup> + revente nette ÷ (1 + r)<sup>h</sup> = 0."],
 when:{"jv": "v.reg==='jean'"},
 watch:['Ne modélise pas le plafonnement du quotient familial, les déficits BIC reportés ni la surtaxe sur plus-value.','Régime Jeanbrun : acquisitions entre le 21 février 2026 et le 31 décembre 2028 ; les amortissements déduits sont réintégrés dans la plus-value à la revente (article 150 VB III du CGI).']});


SIMS.push({id:'credit',grp:'Emprunt',name:'Crédit : amortissable, capital constant, in fine, différé',lead:'Mensualité, intérêts, TAEG, tableau d’amortissement : on compare les modes de remboursement comme en cours.',
 how:['Le <b>prêt amortissable à mensualités constantes</b> (annuités constantes) : chaque mensualité est la même ; au début elle rembourse surtout des intérêts, à la fin surtout du capital.','L’<b>amortissement constant du capital</b> : on rembourse la même part de capital chaque mois, donc des mensualités qui baissent. L’<b>in fine</b> : on ne paie que les intérêts, le capital est rendu en une fois à l’échéance. Le <b>différé</b> partiel (intérêts seuls) ou total (intérêts capitalisés) retarde l’amortissement.','Le <b>taux d’effort</b> = (mensualités + assurance + autres crédits) ÷ revenus ; le HCSF recommande 35 % maximum, sur 25 ans (27 avec différé de construction ou travaux importants). Le <b>TAEG</b> inclut intérêts, assurance et frais ; il ne peut dépasser le <b>taux d’usure</b>.'],
 ctl:v=>ui.sel('type','Mode de remboursement',LOAN_TYPES,'amort')+ui.sl('p','Montant emprunté',10000,5000000,5000,300000,' €')+ui.sl('t','Taux nominal annuel',0,9,.01,3.4,' %')+ui.sl('n','Durée',1,40,1,20,' ans')+ui.sl('d','Durée du différé (différé partiel ou total)',0,60,1,12,' mois')+ui.sl('ass','Assurance emprunteur (taux annuel sur le capital initial)',0,1.5,.01,.25,' %')+ui.sl('fd','Frais de dossier',0,10000,50,1000,' €')+ui.sl('fg','Frais de garantie',0,30000,100,3000,' €')+ui.t('Foyer')+ui.sl('rev','Revenus nets mensuels du foyer',1000,50000,100,6000,' €')+ui.sl('autres','Autres crédits en cours (mensualités)',0,5000,10,0,' €')+ui.t('Comparer les modes')+ui.sl('maj','Majoration de taux de l’in fine',0,2,.05,.6,' pt','Les prêts in fine sont en général de 0,5 à 1 point au-dessus d’un prêt amortissable.')+ui.seg('tab','Tableau d’amortissement',[['y','Annuel'],['m','Mensuel']],'y')+ui.t('Remboursement anticipé (amortissable)')+ui.sl('ra','Montant remboursé par anticipation',0,2000000,1000,0,' €')+ui.sl('raAn','Année du remboursement',1,29,1,5,' an')+ui.seg('raMode','Effet',[['duree','Réduire la durée'],['mens','Réduire la mensualité']],'duree'),
 calc:v=>{const o=type=>({P:v.p,t:type==='infine'?v.t+v.maj:v.t,n:v.n,type,d:v.d,ass:v.ass,ra:type===v.type?v.ra:0,raAn:v.raAn,raMode:v.raMode});
  const L=loanRows(o(v.type)),rows=L.rows,fees=v.fd+v.fg,first=rows[0],cur=rs=>rs.filter((r,i)=>!(v.type==='infine'&&i===rs.length-1)),maxPay=Math.max(...cur(rows).map(r=>r.pay+r.A)),last=rows[rows.length-1];
  const effort=(maxPay+v.autres)/v.rev*100,reste=v.rev-maxPay-v.autres,taeg=loanTaeg(v.p,fees,rows),cost=L.totI+L.totA+fees+L.penal,tFin=v.type==='infine'?v.t+v.maj:v.t;
  const usure=v.n<10?4.09:v.n<20?4.68:5.40,usureLab=v.n<10?'4,09 % (4ᵉ trimestre 2026)':v.n<20?'4,68 % (4ᵉ trimestre 2026)':'5,40 % (4ᵉ trimestre 2026)';
  const unit=loanRows({P:1,t:tFin,n:v.n,type:v.type,d:v.d,ass:v.ass}),cap=(.35*v.rev-v.autres)/Math.max(...cur(unit.rows).map(r=>r.pay+r.A));
  const yrs=loanYears(rows),mAvg=rows.reduce((a,r)=>a+r.pay,0)/rows.length;
  const cmp=[['amort','Mensualités constantes'],['capcst','Capital constant'],['infine','In fine (taux majoré)'],['diffp','Différé partiel']].map(([ty,lab])=>{const R=loanRows(o(ty)),rr=R.rows,c2=R.totI+R.totA+fees,tg=loanTaeg(v.p,fees,rr);return [lab,E(rr[0].pay+rr[0].A),E(rr[rr.length-1].pay+rr[rr.length-1].A),E(R.totI),E(c2),P(tg,2)]});
  const sens=[-1,0,1].map(d=>{const tt=Math.max(0,tFin+d),R=loanRows(Object.assign({},o(v.type),{t:tt,ra:0})),mx=Math.max(...R.rows.map(r=>r.pay+r.A));const U=loanRows({P:1,t:tt,n:v.n,type:v.type,d:v.d,ass:v.ass});return [P(tt,2),E(R.rows[0].pay),E(R.totI),E((.35*v.rev-v.autres)/Math.max(...cur(U.rows).map(r=>r.pay+r.A)))]});
  const tabHead=['Année','Échéances payées','Intérêts','Capital remboursé','Assurance','Restant dû'],tabRows=v.tab==='y'?yrs.map(y=>[y.y,E(y.pay),E(y.i),E(y.pr),E(y.A),E(y.k)]):rows.map(r=>[r.t,E(r.pay),E(r.i),E(r.pr),E(r.A),E(r.k)]);
  if(v.tab==='m')tabHead[0]='Mois';
  const bal=[v.p,...yrs.map(y=>y.k)],cumI=[0];yrs.reduce((a,y)=>{cumI.push(a+y.i);return a+y.i},0);
  return ui.card('',ui.kpis([['Première échéance (hors assurance)',E(first.pay)],['Dernière échéance (hors assurance)',E(last.pay)],[v.type==='infine'?'Échéance mensuelle, assurance comprise':'Échéance la plus élevée, assurance comprise',E(maxPay),'hi'],...(v.type==='infine'?[['Remboursement final du capital (dernière échéance)',E(last.pay)]]:[]),['Taux d’effort (HCSF, assurance comprise)',`<span class="${effort>35?'bad':'good'}">${P(effort,1)}</span>`],['Reste à vivre mensuel (hors remboursement final)',E(reste)],['Intérêts payés'+(v.type==='difft'?' ou capitalisés':''),E(L.totI)],['Coût total (intérêts, assurance, frais'+(L.penal?', indemnité':'')+')',E(cost)],['TAEG approché',`<span class="${taeg>usure?'bad':''}">${P(taeg,2)}</span>`],['Taux d’usure applicable',usureLab],['Capacité d’emprunt à 35 %',E(cap)]]))
  +(v.type==='infine'?ui.warn('Prêt in fine : le capital de '+E(v.p)+' reste dû en totalité jusqu’à l’échéance. Il faut le reconstituer (assurance-vie nantie en général) : voir le simulateur « Prêt in fine adossé à un placement ». Taux utilisé : '+P(tFin,2)+'.'):'')
  +(v.type==='difft'?ui.warn('Différé total : les intérêts de '+v.d+' mois sont capitalisés ; le capital à amortir est de '+E(rows[Math.min(v.d,rows.length)-1].k)+' au premier remboursement.'):'')
  +(v.n>25?ui.warn('Au-delà de 25 ans, la durée dépasse la recommandation du HCSF (27 ans possibles avec différé de construction ou travaux importants).'):'')+(taeg>usure?ui.warn('Le TAEG dépasse le taux d’usure : la banque ne peut pas accorder ce prêt à ces conditions.'):'')
  +(L.raDone?ui.warn('Remboursement anticipé de '+E(L.raDone)+' en année '+v.raAn+' : indemnité maximale légale ≈ '+E(L.penal)+' (6 mois d’intérêts sur le capital remboursé, plafonnés à 3 % du capital restant dû ; aucune indemnité en cas de vente pour mutation professionnelle, licenciement ou décès). '+(v.raMode==='duree'?'Le prêt se termine en '+N(L.months/12,1)+' ans.':'La nouvelle échéance est de '+E(L.mNew)+'.')):(v.ra>0&&v.type!=='amort'&&v.type!=='capcst'?ui.note('Le remboursement anticipé n’est simulé que pour les prêts amortissables.'):''))
  +ui.card('Les modes de remboursement comparés (même capital, même durée)',ui.table(['Mode','1ʳᵉ échéance','Dernière échéance','Intérêts','Coût total','TAEG'],cmp)+ui.note('Échéances assurance comprise ; coût total = intérêts + assurance + frais. L’in fine rembourse le capital en une fois à la dernière échéance.'))
  +ui.card('Capital restant dû et intérêts cumulés',lineChart({labels:bal.map((_,i)=>'An '+i),series:[{name:'Capital restant dû',values:bal},{name:'Intérêts cumulés',values:cumI,color:COLS[2]}],yMin0:true}))
  +ui.card('Échéance annuelle : capital, intérêts et assurance',barChart({items:yrs.slice(0,12).map((y,i)=>({label:'An '+y.y,value:y.pay+y.A,color:COLS[i%6]})),aria:'Échéances annuelles'})+ui.note(yrs.length>12?'Les 12 premières années sont affichées.':'Toutes les années sont affichées.'))
  +ui.card('Si le taux était différent',ui.table(['Taux','Première échéance','Intérêts','Capacité d’emprunt (35 %)'],sens))
  +ui.card(v.tab==='y'?'Tableau d’amortissement annuel':'Tableau d’amortissement mensuel',`<div style="max-height:420px;overflow:auto">`+ui.table(tabHead,tabRows)+`</div>`)
  +ui.note('Assurance calculée sur le capital initial. Le TAEG approché inclut l’assurance et les frais de dossier et de garantie, hors frais de courtage. Le taux d’usure est le plafond légal du TAEG (4ᵉ trimestre 2026, avis du 25 septembre 2026 : 4,09 % sous 10 ans, 4,68 % de 10 à moins de 20 ans, 5,40 % à partir de 20 ans).')},
 faq:[['Quelle est la différence entre mensualités constantes et capital constant ?','Avec des mensualités constantes, la mensualité ne bouge pas mais la part de capital augmente. Avec le capital constant, on rembourse chaque mois la même part de capital : la première mensualité est plus élevée, puis elles baissent, et le coût en intérêts est plus faible.'],['Comment fonctionne un prêt in fine ?','On ne paie que les intérêts (et l’assurance) ; le capital est remboursé en une fois à l’échéance. Les intérêts sont donc plus élevés et le taux majoré. En général, la banque demande un placement nanti (assurance-vie) pour reconstituer le capital.'],['À quoi sert un différé ?','Un différé partiel réduit les mensualités pendant la période (intérêts seuls) ; un différé total ne demande rien mais les intérêts sont capitalisés, donc le coût augmente. Il est utilisé pendant des travaux ou une construction.'],['Combien puis-je emprunter ?','Le HCSF recommande 35 % de taux d’effort maximum, assurance comprise. Le résultat « capacité d’emprunt » le calcule pour le taux, la durée et le mode choisis.'],['Que se passe-t-il si je rembourse par anticipation ?','On peut réduire la durée ou la mensualité. L’indemnité est plafonnée à 6 mois d’intérêts sur le capital remboursé et à 3 % du capital restant dû ; elle n’est pas due dans certains cas (mutation professionnelle, licenciement, décès).']],
 formulas:["<b>Mensualité constante</b> M = P × r ÷ (1 − (1 + r)<sup>−N</sup>), avec r le taux mensuel (taux annuel ÷ 12) et N le nombre de mois. Exemple : 300 000 € à 3,4 % sur 20 ans → r = 0,2833 %, N = 240, M ≈ 1 725 €.", "<b>Chaque mois</b> : intérêts = capital restant dû × r ; capital remboursé = M − intérêts ; nouveau capital restant dû = ancien − capital remboursé.", "<b>Capital constant</b> : capital remboursé = P ÷ N chaque mois ; échéance = P ÷ N + intérêts du mois (donc décroissante).", "<b>In fine</b> : échéance mensuelle = P × r (intérêts seuls) ; dernière échéance = P × r + P. <b>Différé partiel</b> : intérêts seuls pendant d mois, puis mensualité constante sur N − d mois. <b>Différé total</b> : capital après différé = P × (1 + r)<sup>d</sup>, puis mensualité constante sur N − d mois.", "<b>Assurance mensuelle</b> = P × taux d’assurance annuel ÷ 12 (sur le capital initial).", "<b>Taux d’effort</b> = (échéance + assurance + autres crédits) ÷ revenus nets ; limite recommandée de 35 %. <b>Reste à vivre</b> = revenus − échéance − assurance − autres crédits.", "<b>TAEG</b> : le taux annuel équivalent (1 + i)<sup>12</sup> − 1, où i est le taux mensuel qui vérifie P − frais = Σ (échéance + assurance)<sub>t</sub> ÷ (1 + i)<sup>t</sup>.", "<b>Capacité d’emprunt</b> = (35 % × revenus − autres crédits) ÷ (plus forte échéance par euro emprunté + assurance par euro).", "<b>Indemnité de remboursement anticipé</b> = min(6 mois d’intérêts sur le capital remboursé ; 3 % du capital restant dû avant remboursement)."],
 when:{"d": "v.type==='diffp'||v.type==='difft'", "ra": "v.type==='amort'||v.type==='capcst'", "raAn": "(v.type==='amort'||v.type==='capcst')&&v.ra>0", "raMode": "(v.type==='amort'||v.type==='capcst')&&v.ra>0"},
 watch:['Taux d’usure : révisé chaque trimestre (4ᵉ trimestre 2026 : 4,09 %, 4,68 %, 5,40 %) ; à relire au 1ᵉʳ janvier 2027.','La banque peut refuser un remboursement partiel inférieur à 10 % du montant initial du prêt, sauf solde.','Majoration de l’in fine : 0,5 à 1 point selon les guides ; à remplacer par l’offre reçue.']});

SIMS.push({id:'infine',grp:'Emprunt',name:'Prêt in fine adossé à un placement',lead:'Intérêts seuls pendant le prêt, capital reconstitué sur un contrat nanti : coût, versements nécessaires, économie d’impôt, comparaison avec l’amortissable.',
 how:['Dans un <b>prêt in fine</b>, on ne paie que les <b>intérêts</b> (et l’assurance) ; le <b>capital est remboursé en une seule fois</b> à l’échéance. Les intérêts sont constants et plus élevés que dans un prêt amortissable ; le taux est majoré de 0,5 à 1 point.','La banque demande en général un <b>nantissement</b> d’un placement (souvent une assurance-vie) : au moins 30 % du capital au départ, avec des versements réguliers pour atteindre 100 % à l’échéance. Le simulateur calcule le <b>versement mensuel nécessaire</b> pour que le placement, net d’impôt, rembourse le capital.','Pour un investissement locatif au régime réel, les <b>intérêts sont déductibles</b> des revenus fonciers (ou du résultat meublé) : c’est le principal intérêt fiscal pour une TMI élevée. L’opération n’est gagnante que si le rendement net du placement dépasse le coût net de l’emprunt.'],
 ctl:v=>ui.sl('P','Capital emprunté',20000,5000000,5000,300000,' €')+ui.sl('t','Taux du prêt in fine',0,9,.01,4.2,' %','Taux in fine 2026 cités : 4,2 à 4,8 % ; en général 0,5 à 1 point au-dessus de l’amortissable.')+ui.sl('n','Durée',1,40,1,15,' ans')+ui.sl('ass','Assurance emprunteur (taux annuel sur le capital)',0,1.5,.01,.25,' %')+ui.sl('fd','Frais de dossier',0,10000,50,1000,' €')+ui.sl('fg','Frais de garantie',0,30000,100,0,' €','Souvent nul quand le nantissement tient lieu de garantie.')+ui.t('Placement adossé (assurance-vie nantie)')+ui.sl('nant','Versement initial sur le contrat nanti',0,5000000,1000,90000,' €','En général au moins 30 % du capital emprunté.')+ui.sl('vm','Versement mensuel choisi (0 = calcul automatique)',0,20000,10,0,' €')+ui.sl('rend','Rendement brut du placement (avant frais)',0,12,.1,4.6,' %')+ui.sl('fav','Frais annuels du contrat et des supports',0,3,.05,.6,' %')+ui.t('Fiscalité')+ui.seg('ded','Intérêts déduits des revenus fonciers (investissement locatif au réel)',[[0,'Non'],[1,'Oui']],0)+ui.sl('tmi','TMI du foyer',0,45,1,41,' %')+ui.seg('sit','Foyer (abattement assurance-vie)',[[1,'Seul'],[2,'Couple']],1)+ui.t('Comparaison')+ui.sl('tam','Taux d’un prêt amortissable équivalent',0,9,.01,3.6,' %'),
 calc:v=>{const N_=v.n*12,L=loanRows({P:v.P,t:v.t,n:v.n,type:'infine',d:0,ass:v.ass}),A=L.A,intM=v.P*v.t/1200,echeance=intM+A;
  const g=Math.pow(1+(v.rend-v.fav)/100,1/12)-1,fvF=g===0?N_:(Math.pow(1+g,N_)-1)/g,d0=v.nant*Math.pow(1+g,N_);
  const netOf=vm=>{const V=d0+vm*fvF,dep=v.nant+vm*N_,gain=Math.max(0,V-dep),tx=avTax(gain,dep,v.n,v.sit===2,false,0).total;return {V,dep,tx,net:V-tx}};
  let vmNeed=0;if(netOf(0).net<v.P){let lo=0,hi=v.P/N_*3;for(let i=0;i<70;i++){const mid=(lo+hi)/2;if(netOf(mid).net<v.P)lo=mid;else hi=mid}vmNeed=(lo+hi)/2}
  const vm=v.vm>0?v.vm:vmNeed,F=netOf(vm),cover=F.net/v.P*100,fees=v.fd+v.fg;
  const am=loanRows({P:v.P,t:v.tam,n:v.n,type:'amort',d:0,ass:v.ass}),mAm=am.rows[0].pay+am.A,taxRate=v.ded?(v.tmi/100+TAX.psImmo):0;
  const intTot=L.totI,ecoIF=intTot*taxRate,ecoAm=am.totI*taxRate;
  const outIF=echeance*N_+F.dep+fees-ecoIF,outAm=mAm*N_+fees-ecoAm,ecart=outIF-outAm;
  const netCost=v.t*(1-taxRate),netRend=(F.net/Math.max(1,F.dep)>1?(Math.pow(F.net/F.dep,1/v.n)-1)*100:0);
  const yrs=[];let val=v.nant;const capAm=am.rows;for(let y=1;y<=v.n;y++){for(let m=0;m<12;m++)val=val*(1+g)+vm*(1+g);yrs.push([y,E(intM*12),E(A*12),E(vm*12),E(val),E(v.P),E(capAm[Math.min(y*12,capAm.length)-1].k)])}
  const labels=['Départ',...yrs.map((_,i)=>'An '+(i+1))],vals=[v.nant],kam=[v.P];{let w=v.nant;for(let y=1;y<=v.n;y++){for(let m=0;m<12;m++)w=w*(1+g)+vm*(1+g);vals.push(w);kam.push(capAm[Math.min(y*12,capAm.length)-1].k)}}
  const msg=ecart<0?ui.ok('Dans ces hypothèses, l’in fine adossé coûte <b>'+E(Math.abs(ecart))+' de moins</b> (décaissé net d’économie d’impôt) que le prêt amortissable.'):ui.warn('Dans ces hypothèses, l’in fine adossé coûte <b>'+E(ecart)+' de plus</b> que le prêt amortissable. Il devient intéressant si le rendement net du placement dépasse le coût net de l’emprunt, ou si la déduction fiscale des intérêts est forte.');
  return ui.card('',ui.kpis([['Échéance mensuelle (intérêts + assurance)',E(echeance),'hi'],['Capital dû à l’échéance',E(v.P)],['Versement mensuel sur le placement'+(v.vm>0?' (choisi)':' (nécessaire)'),E(vm)],['Effort mensuel total (échéance + versement)',E(echeance+vm)],['Mensualité d’un amortissable équivalent',E(mAm)],['Capital reconstitué net d’impôt à l’échéance',E(F.net)],['Couverture du capital',`<span class="${cover>=99.5?'good':'bad'}">${P(cover,0)}</span>`],['Valeur brute du placement à l’échéance',E(F.V)],['Intérêts totaux',E(intTot)],['Économie d’impôt annuelle sur les intérêts',E(v.P*v.t/100*taxRate)],['Coût net de l’emprunt / rendement net du placement',P(netCost,2)+' / '+P(netRend,2)]]))
  +msg
  +netBlock([{label:'Valeur brute du placement',value:F.V,kind:'total'},{label:'Impôt au rachat',value:-F.tx,kind:'delta'},{label:'Capital reconstitué net',value:F.net,kind:'total'}],'Du placement brut au capital net qui rembourse le prêt')
  +ui.card('Coût total décaissé : in fine adossé contre amortissable',ui.table(['','Prêt in fine adossé','Prêt amortissable'],[['Échéances (intérêts, assurance, capital pour l’amortissable)',E(echeance*N_),E(mAm*N_)],['Versements sur le placement (initial + mensuels)',E(F.dep),'—'],['Frais de dossier et de garantie',E(fees),E(fees)],['Économie d’impôt sur les intérêts',ecoIF?'− '+E(ecoIF):'—',ecoAm?'− '+E(ecoAm):'—'],['Total décaissé',E(outIF),E(outAm)]],true))
  +ui.card('Capital dû et valeur du placement',lineChart({labels,series:[{name:'Capital dû (in fine)',values:kam.map(()=>v.P),color:COLS[2]},{name:'Valeur brute du placement',values:vals},{name:'Capital dû (amortissable)',values:kam,dash:'5 4',color:COLS[1]}],yMin0:true}))
  +ui.card('Année par année',ui.table(['Année','Intérêts payés','Assurance','Versements placement','Valeur du placement','Capital dû (in fine)','Capital dû (amortissable)'],yrs))
  +ui.note('Rendement net du placement = rendement brut − frais annuels, capitalisé mensuellement ; impôt de l’assurance-vie au rachat de fin de prêt (abattement et 7,5 % après 8 ans). Économie d’impôt = intérêts × (TMI + 17,2 %), à condition que les revenus fonciers suffisent : le déficit lié aux intérêts n’est imputable que sur les revenus fonciers des 10 années suivantes, pas sur le revenu global. Pour l’IFI, la dette in fine n’est déductible qu’à hauteur de : emprunt × (1 − années écoulées ÷ durée totale), c’est-à-dire d’un amortissement théorique linéaire (article 974 II du CGI).')},
 faq:[['Pourquoi choisir un prêt in fine ?','Pour déduire des intérêts constants et élevés des revenus fonciers (TMI élevée), garder son épargne investie plutôt que de la consommer, et ne pas décaisser de capital pendant le prêt. Ce n’est pas un prêt moins cher : le taux est majoré.'],['Qu’est-ce que le nantissement ?','L’assurance-vie (ou un autre placement) est donnée en garantie à la banque. En général 30 % au minimum du capital au départ (certaines banques 50 %), avec des versements pour atteindre 100 % à l’échéance.'],['Que se passe-t-il si le placement n’atteint pas le capital ?','Il faut compléter de sa poche, ou revendre. La « couverture » du résultat le montre ; testez un rendement plus faible.'],['L’in fine est-il toujours plus cher ?','Les intérêts sont plus élevés, mais l’économie d’impôt et le rendement du placement peuvent compenser : le tableau « coût total décaissé » compare les deux modes avec vos hypothèses.'],['À qui convient-il ?','À un investisseur locatif à TMI élevée, avec un patrimoine pour constituer le nantissement. Il demande des revenus stables et un placement prudent.']],
 formulas:["<b>Échéance mensuelle</b> = P × taux ÷ 12 + P × taux d’assurance ÷ 12 ; capital dû à l’échéance = P.", "<b>Placement</b> : g = (1 + rendement − frais)<sup>1 ÷ 12</sup> − 1 ; valeur après N mois = versement initial × (1 + g)<sup>N</sup> + versement mensuel × ((1 + g)<sup>N</sup> − 1) ÷ g.", "<b>Versement mensuel nécessaire</b> : celui pour lequel valeur − impôt du rachat (formule de l’assurance-vie) = P ; résolu par dichotomie.", "<b>Économie d’impôt annuelle</b> = intérêts annuels × (TMI + 17,2 %), si les intérêts sont déduits des revenus fonciers.", "<b>Coût total décaissé</b> : in fine = échéances × N + versements sur le placement (initial + mensuels) + frais − économie d’impôt ; amortissable = mensualités × N + frais − économie d’impôt. <b>Couverture</b> = capital net reconstitué ÷ P.", "<b>IFI</b> : dette déductible l’année t = emprunt × (1 − t ÷ durée totale), amortissement théorique linéaire (article 974 II du CGI)."],
 when:{"tmi": "v.ded===1"},
 watch:['Taux, majoration et nantissement : à lire dans l’offre de la banque ; valeurs de départ tirées de guides 2026.','Déduction des intérêts : revenus fonciers au régime réel ou résultat LMNP ; le déficit lié aux intérêts ne s’impute pas sur le revenu global.']});


SIMS.push({id:'relais',grp:'Emprunt',name:'Prêt relais : coût et risque de revente',lead:'Acheter avant de vendre : montant avancé, intérêts, franchise partielle ou totale, et ce qui reste si la vente se fait moins cher.',
 how:['Un <b>prêt relais</b> avance une partie de la valeur du bien à vendre pour financer le nouvel achat : montant = valeur estimée × quotité − capital restant dû. La quotité est de 50 à 80 % (souvent 70 %).','La durée est courte : <b>12 mois, renouvelable une fois</b> (24 mois au plus). On paie les <b>intérêts seuls</b> (franchise partielle) ou rien (franchise totale : les intérêts sont <b>capitalisés</b> et réglés à la vente).','Le <b>risque</b> : si la vente tarde ou se fait sous l’estimation, le produit de la vente peut ne pas couvrir le relais. Le prêt relais entre dans le taux d’endettement.'],
 ctl:v=>ui.sl('val','Valeur estimée du bien à vendre',50000,5000000,5000,350000,' €')+ui.sl('crd','Capital restant dû sur le bien à vendre',0,3000000,1000,80000,' €')+ui.sl('quot','Quotité financée',40,90,1,70,' %','50 à 80 % ; souvent 70 % ; jusqu’à 70-80 % avec un compromis signé selon les guides.')+ui.seg('fr','Franchise',[['part','Partielle : intérêts payés chaque mois'],['tot','Totale : intérêts capitalisés']],'part')+ui.sl('t','Taux du prêt relais',0,9,.01,3.8,' %')+ui.sl('ass','Assurance (taux annuel sur le relais)',0,1.5,.01,.25,' %')+ui.sl('fd','Frais de dossier',0,10000,50,1000,' €','0,5 à 1 % du montant, souvent entre 500 et 1 500 € selon les guides.')+ui.sl('fg','Frais de garantie',0,20000,100,0,' €')+ui.t('Délai et prix de vente')+ui.sl('delai','Délai réel de vente',1,30,1,9,' mois')+ui.sl('prix','Prix de vente obtenu (% de l’estimation)',50,120,1,100,' %')+ui.sl('fa','Frais de vente (agence, diagnostics, mainlevée)',0,10,.1,4,' %','À saisir selon le mandat.')+ui.t('Nouvel achat')+ui.sl('achat','Coût du nouveau bien (frais compris)',50000,5000000,5000,450000,' €')+ui.sl('apport','Apport personnel',0,2000000,1000,40000,' €'),
 calc:v=>{const r=v.t/1200,relais=Math.max(0,v.val*v.quot/100-v.crd),interets=v.fr==='part'?relais*r*v.delai:relais*(Math.pow(1+r,v.delai)-1),assur=relais*v.ass/100*v.delai/12,fees=v.fd+v.fg,cost=interets+assur+fees,monthly=v.fr==='part'?relais*r+relais*v.ass/1200:relais*v.ass/1200;
  const venteNet=v.val*v.prix/100*(1-v.fa/100),dette=v.crd+relais+(v.fr==='tot'?interets:0),solde=venteNet-dette,minPct=dette/(1-v.fa/100)/v.val*100,besoin=v.achat-v.apport-relais;
  const grid=[100,95,90,85,80,70],sc=grid.map(p=>{const vn=v.val*p/100*(1-v.fa/100),s=vn-dette;return [P(p,0),E(v.val*p/100),E(vn),E(dette),`<span class="${s>=0?'good':'bad'}">${sgn(s)}</span>`]});
  const line=[];for(let p=60;p<=110;p+=5)line.push([p,v.val*p/100*(1-v.fa/100)-dette]);
  return ui.card('',ui.kpis([['Montant du prêt relais',E(relais),'hi'],['Échéance mensuelle (intérêts + assurance)',E(monthly)],['Intérêts sur '+v.delai+' mois'+(v.fr==='tot'?' (capitalisés)':''),E(interets)],['Assurance et frais',E(assur+fees)],['Coût total du relais',E(cost)],['Crédit complémentaire à prévoir pour le nouvel achat',E(Math.max(0,besoin))],['Dette à solder à la vente (capital, relais, intérêts capitalisés)',E(dette)],['Solde après vente et remboursement',`<span class="${solde>=0?'good':'bad'}">${sgn(solde)}</span>`],['Prix de vente minimum pour tout rembourser',P(minPct,1)+' de l’estimation']]))
  +(v.delai>24?ui.warn('Au-delà de 24 mois, le prêt relais doit être transformé en prêt classique, avec des frais supplémentaires.'):v.delai>12?ui.warn('Au-delà de 12 mois, le relais doit être renouvelé (une fois, jusqu’à 24 mois) : des frais et un taux peuvent s’appliquer.'):'')+(solde<0?ui.warn('La vente à ce prix ne couvre pas la dette : il manque '+E(-solde)+' de sa poche ou par un crédit complémentaire.'):'')+(besoin<0?ui.note('Apport et relais dépassent le coût du nouveau bien : aucun crédit complémentaire nécessaire.'):'')
  +ui.card('Solde après la vente selon le prix obtenu',lineChart({labels:line.map(x=>x[0]+' %'),series:[{name:'Solde après remboursement du relais',values:line.map(x=>x[1])}],hlines:[{v:0,label:'Équilibre',color:COLS[2]}],dots:true}))
  +ui.card('Scénarios de prix de vente',ui.table(['Prix (% estimation)','Prix de vente','Net de frais de vente','Dette à solder','Solde'],sc))
  +ui.card('Combien coûte chaque mois de retard ?',ui.table(['Mois supplémentaire','Coût'],[['Intérêts (franchise partielle) ou intérêts capitalisés',E(relais*r)],['Assurance',E(relais*v.ass/1200)],['Total par mois',E(relais*r+relais*v.ass/1200)]],true))
  +ui.note('Le montant avancé est calculé sur la valeur estimée et non sur le prix de vente final ; en franchise totale, les intérêts s’ajoutent à la dette. Le prêt relais est pris en compte dans le taux d’endettement (35 %) pendant la durée du relais et du crédit complémentaire.')},
 faq:[['Combien la banque avance-t-elle ?','Entre 50 et 80 % de la valeur estimée du bien à vendre, souvent 70 %, moins le capital restant dû.'],['Que se passe-t-il si je ne vends pas dans les 12 mois ?','Le relais peut être renouvelé une fois, jusqu’à 24 mois. Au-delà, il faut le transformer en prêt classique. Chaque mois de retard coûte des intérêts et de l’assurance.'],['Et si je vends moins cher que l’estimation ?','Le tableau des scénarios le montre : le solde peut devenir négatif. Le « prix de vente minimum » donne le prix en dessous duquel il manque de l’argent.'],['Franchise partielle ou totale ?','La partielle demande de payer les intérêts chaque mois ; la totale ne demande rien mais les intérêts sont capitalisés et le coût total augmente.'],['Le prêt relais compte-t-il dans mon taux d’endettement ?','Oui, il entre dans le calcul du taux d’endettement encadré par le HCSF, pendant et après la période relais.']],
 formulas:["<b>Montant du relais</b> = valeur estimée × quotité − capital restant dû de l’ancien bien.", "<b>Intérêts</b> : franchise partielle = relais × taux ÷ 12 × nombre de mois ; franchise totale (capitalisation) = relais × ((1 + taux ÷ 12)<sup>mois</sup> − 1).", "<b>Assurance</b> = relais × taux d’assurance × mois ÷ 12. <b>Coût total</b> = intérêts + assurance + frais de dossier et de garantie.", "<b>Solde après vente</b> = prix de vente × (1 − frais de vente) − capital restant dû − relais − intérêts capitalisés.", "<b>Prix de vente minimum</b> = (capital restant dû + relais + intérêts capitalisés) ÷ (1 − frais de vente) ÷ valeur estimée."],
 watch:['Quotité, durée, taux et frais : fourchettes de guides 2026 ; à remplacer par l’offre de la banque.','La valeur estimée du bien est celle de la banque, souvent prudente : se faire estimer par plusieurs professionnels.']});


SIMS.push({id:'lombard',grp:'Emprunt',name:'Crédit lombard : emprunter sur son portefeuille',lead:'Emprunter sans vendre : quotité, coût, marge de sécurité, probabilité d’appel de marge.',
 how:['Le <b>crédit lombard</b> est un prêt garanti par le <b>nantissement</b> d’un portefeuille (compte-titres, assurance-vie, parfois PEA selon les banques). Il est le plus souvent <b>in fine</b> : intérêts payés (trimestriellement) ou capitalisés, capital rendu à l’échéance ou à la demande.','Le <b>taux</b> est variable : Euribor 3 mois (2,597 % au 5 octobre 2026) plus une marge de 0,8 à 2,5 % selon les guides. La <b>quotité</b> (LTV) dépend des actifs : 50 à 70 % pour des actions et ETF, davantage pour des obligations de qualité et le fonds euros.','Le <b>risque</b> : si le portefeuille baisse, la quotité réelle monte. Au-delà du seuil de la convention, c’est l’<b>appel de marge</b> : il faut rembourser ou nantir davantage, sinon la banque peut vendre les titres.'],
 ctl:v=>ui.sl('pf','Valeur du portefeuille nanti',10000,20000000,10000,1000000,' €')+ui.sl('ltv0','Quotité empruntée (en % du portefeuille)',5,90,1,40,' %')+ui.sl('ltvMax','Quotité maximale avant appel de marge',10,95,1,60,' %','À lire dans la convention : en général 50 à 70 % pour des actions et ETF, jusqu’à 70-90 % pour des obligations de qualité.')+ui.sl('eur','Euribor 3 mois',0,6,.01,2.6,' %','2,597 % au 5 octobre 2026.')+ui.sl('marge','Marge de la banque',0,4,.05,1.4,' %','0,8 à 2,5 % selon les guides.')+ui.sl('frais','Frais de mise en place et de nantissement',0,20000,100,1000,' €')+ui.sl('n','Durée du crédit',1,40,1,5,' ans')+ui.seg('mode','Intérêts',[['p','Payés chaque trimestre'],['c','Capitalisés']],'p')+ui.t('Portefeuille')+ui.sl('rp','Rendement attendu du portefeuille',0,12,.1,6,' %')+ui.sl('s','Volatilité du portefeuille',3,35,.5,15,' %')+ui.t('Usage du crédit')+ui.seg('usage','Que fait le client de l’argent ?',[['besoin','Finance un besoin sans vendre'],['inv','Investit davantage']],'besoin')+ui.sl('plv','Part de plus-value latente dans la valeur vendue',0,100,1,30,' %','Sert à chiffrer l’impôt évité en ne vendant pas.')+ui.sl('ri','Rendement du placement financé par le crédit',0,12,.1,6,' %'),
 calc:v=>{const B=v.pf*v.ltv0/100,taux=v.eur+v.marge,tr=taux/100,intA=B*tr,coutP=intA*v.n,coutC=B*(Math.pow(1+tr,v.n)-1),cout=(v.mode==='p'?coutP:coutC)+v.frais;
  const baisse=Math.max(0,(1-v.ltv0/v.ltvMax)*100),seuilVal=B/(v.ltvMax/100);
  const res=mcPaths({cap0:v.pf,years:v.n,m:v.rp/100,s:v.s/100,N:1000});let calls=0;res.paths.forEach(p=>{let hit=false;for(let t=1;t<p.length;t++){if(p[t]<=seuilVal){hit=true;break}}if(hit)calls++});const probCall=calls/res.N*100;
  const grid=[0,10,20,30,40,50],st=grid.map(b=>{const val=v.pf*(1-b/100),ltv=B/val*100,call=ltv>v.ltvMax,aMettre=Math.max(0,B-v.ltvMax/100*val),nant=Math.max(0,B/(v.ltvMax/100)-val);return [P(b,0),E(val),`<span class="${call?'bad':'good'}">${P(ltv,0)}</span>`,call?'Appel de marge':'Rien',call?E(aMettre)+' à rembourser ou '+E(nant)+' à nantir':'—']});
  const impVente=B*v.plv/100*TAX.pfu,gainInv=B*(v.ri/100-tr)*v.n,gainNet=gainInv>0?gainInv*(1-TAX.pfu):gainInv;
  const lt=[];for(let b=0;b<=60;b+=5)lt.push([b,B/(v.pf*(1-b/100))*100]);
  return ui.card('',ui.kpis([['Montant emprunté',E(B),'hi'],['Taux (Euribor + marge)',P(taux,2)],['Intérêts annuels',E(intA)],['Coût total sur '+v.n+' ans (intérêts '+(v.mode==='p'?'payés':'capitalisés')+' + frais)',E(cout)],['Baisse du portefeuille avant appel de marge',P(baisse,0)],['Valeur du portefeuille déclenchant l’appel',E(seuilVal)],['Probabilité d’un appel de marge sur '+v.n+' ans',`<span class="${probCall<10?'good':probCall<25?'':'bad'}">${P(probCall,0)}</span>`],v.usage==='besoin'?['Impôt évité en ne vendant pas (PFU sur la plus-value latente)',E(impVente)]:['Gain net attendu du placement financé, après coût du crédit',`<span class="${gainNet>=0?'good':'bad'}">${sgn(gainNet)}</span>`]]))
  +(v.ltv0>v.ltvMax?ui.warn('La quotité empruntée dépasse la quotité maximale : l’appel de marge est immédiat.'):'')+(baisse<20?ui.warn('Marge de sécurité faible : une baisse de '+P(baisse,0)+' du portefeuille suffit à déclencher un appel de marge. Une quotité de 40 à 50 % laisse davantage de marge sur un portefeuille en actions.'):'')
  +ui.card('Quotité réelle selon la baisse du portefeuille',lineChart({labels:lt.map(x=>'−'+x[0]+' %'),series:[{name:'Quotité réelle (emprunt ÷ portefeuille)',values:lt.map(x=>x[1])}],hlines:[{v:v.ltvMax,label:'Seuil d’appel de marge',color:COLS[2]},{v:v.ltv0,label:'Quotité de départ',color:COLS[4]}],fmt:x=>N(x,0)+' %',dots:true}))
  +ui.card('Stress du portefeuille',ui.table(['Baisse','Valeur du portefeuille','Quotité réelle','Situation','Pour revenir au seuil'],st))
  +(v.usage==='besoin'?ui.card('Emprunter ou vendre pour financer '+E(B)+' ?',ui.table(['','Emprunter (lombard)','Vendre'],[['Coût sur '+v.n+' ans',E(cout),'—'],['Impôt immédiat sur la plus-value (PFU)','—',E(impVente)],['Le portefeuille continue de travailler','Oui, rendement attendu '+P(v.rp,1),'Non pour la part vendue'],['Risque','Appel de marge, taux variable','Aucun appel de marge']])):ui.card('Effet de levier',ui.table(['Élément','Montant'],[['Rendement du placement financé',P(v.ri,2)],['Coût du crédit',P(taux,2)],['Écart annuel brut',P(v.ri-taux,2)],['Gain brut sur '+v.n+' ans',sgn(gainInv)],['Gain net après PFU',sgn(gainNet)]],true)))
  +ui.note('Taux constant sur la durée (il est variable en réalité : une hausse de 1 point ajoute '+E(B*.01)+' par an). La probabilité d’appel de marge est estimée sur des observations annuelles du portefeuille : elle sous-estime les baisses rapides en cours d’année. Les intérêts capitalisés ne sont pas ajoutés à la quotité réelle dans le stress. Délai de réaction à un appel de marge : de 24 à 72 heures selon certaines conventions.')},
 faq:[['À quoi sert un crédit lombard ?','À obtenir des liquidités sans vendre ses placements (donc sans impôt immédiat sur la plus-value), ou à investir davantage avec un effet de levier.'],['Combien peut-on emprunter ?','Une quotité de 50 à 70 % pour des actions et ETF diversifiés, 70 à 90 % pour des obligations de qualité, davantage pour un fonds euros, et zéro pour du private equity ou certaines SCPI : à lire dans la convention de la banque.'],['Qu’est-ce qu’un appel de marge ?','Si la valeur du portefeuille baisse, la quotité réelle monte. Au-delà du seuil prévu, la banque demande de rembourser une partie du crédit ou de nantir davantage ; sinon elle peut vendre les titres.'],['Le taux est-il fixe ?','Non, il est le plus souvent variable : Euribor 3 mois plus une marge. Une hausse des taux alourdit le coût.'],['Est-ce adapté à tous les clients ?','Non : il suppose un patrimoine financier important, une tolérance à l’appel de marge et un suivi rapproché. Une quotité prudente (40 à 50 %) réduit le risque.']],
 formulas:["<b>Montant emprunté</b> = valeur du portefeuille × quotité utilisée.", "<b>Taux</b> = Euribor 3 mois + marge. <b>Intérêts annuels</b> = emprunt × taux ; s’ils sont capitalisés, coût sur n ans = emprunt × ((1 + taux)<sup>n</sup> − 1).", "<b>Quotité réelle</b> = emprunt ÷ (portefeuille × (1 − baisse)). <b>Baisse admissible</b> avant appel de marge = 1 − quotité utilisée ÷ quotité maximale.", "<b>Pour revenir au seuil</b> : montant à rembourser = emprunt − quotité maximale × valeur du portefeuille ; ou nantissement à ajouter = emprunt ÷ quotité maximale − valeur du portefeuille.", "<b>Probabilité d’appel de marge</b> = part des 1 000 trajectoires où la valeur du portefeuille, observée chaque année, passe sous emprunt ÷ quotité maximale.", "<b>Impôt évité</b> en ne vendant pas = emprunt × part de plus-value latente × 31,4 %."],
 when:{"ri": "v.usage==='inv'", "plv": "v.usage==='besoin'"},
 watch:['Quotités, marges et délais d’appel : fourchettes de guides 2026 ; elles varient selon la banque et les actifs nantis.','Euribor 3 mois : 2,597 % au 5 octobre 2026 ; à relire le jour du rendez-vous.']});

SIMS.push({id:'pe',grp:'Non coté',name:'Private equity : courbe en J, multiple, TRI',lead:'Appels de fonds, distributions, frais et fiscalité d’un fonds fermé ou d’un fonds evergreen.',
 how:['Un fonds fermé <b>appelle l’argent progressivement</b> (le client s’engage sur un montant) puis <b>distribue</b> au fil des cessions : l’argent est bloqué 8 à 12 ans.','La <b>courbe en J</b> : les premières années, le client a payé des frais et rien reçu ; le point bas de trésorerie précède le retour à l’équilibre.','Le gérant touche des <b>frais de gestion</b> et, au-delà d’un rendement minimal (<b>hurdle</b>), une part des gains (<b>carried interest</b>).'],
 ctl:v=>ui.seg('type','Véhicule',[['closed','Fonds fermé (FPCI, FCPR)'],['ever','Fonds evergreen']],'closed')+ui.sl('eng','Engagement',1000,3000000,1000,100000,' €','FPCI : 100 000 € minimum pour un investisseur averti non professionnel ; FCPR grand public dès 1 000 à 10 000 €.')+ui.sl('tvpi','Multiple brut visé (TVPI)',0.5,5,.05,2,' x','Multiple du capital investi avant frais et carried interest.')+ui.sl('dur','Durée du fonds',2,40,1,10,' ans')+ui.sl('inv','Période d’investissement (appels)',1,20,1,4,' ans','Limitée à la durée du fonds moins un an.')+ui.sl('fe','Droits d’entrée (en % de l’engagement)',0,8,.1,0,' %','FCPR grand public : droits d’entrée possibles ; à lire dans le DIC.')+ui.sl('fg','Frais de gestion annuels (sur l’engagement)',0,4,.05,2,' %')+ui.sl('carry','Intéressement du gérant (carried interest)',0,30,1,20,' %')+ui.sl('hurdle','Rendement préférentiel (hurdle)',0,12,.5,8,' %')+ui.seg('catch','Rattrapage (catch-up)',[[1,'Oui : carried sur tout le profit'],[0,'Non : carried au-delà du hurdle']],1)+ui.seg('fisc','Fiscalité à la sortie',[['fcpr','FCPR fiscal : 0 % IR après 5 ans, PS 18,6 %'],['pfu','PFU 31,4 %'],['av','Assurance-vie']],'fcpr')+ui.sl('ever_r','Fonds evergreen : rendement net annuel',0,15,.1,9,' %'),
 calc:v=>{const INV=Math.min(v.inv,v.dur-1);const taxOf=g=>v.fisc==='fcpr'?Math.max(0,g)*TAX.ps:v.fisc==='pfu'?Math.max(0,g)*TAX.pfu:avTax(Math.max(0,g),v.eng,v.dur,false,false,0).total;
  if(v.type==='ever'){const c=[v.eng*(1-v.fe/100)];for(let t=1;t<=v.dur;t++)c.push(c[t-1]*(1+v.ever_r/100));const g=c[v.dur]-v.eng,tax=taxOf(g);
   return ui.card('',ui.kpis([['Valeur finale brute',E(c[v.dur]),'hi'],['Impôt à la sortie',E(tax)],['Net',E(c[v.dur]-tax)],['TRI net d’impôt',P((Math.pow((c[v.dur]-tax)/v.eng,1/v.dur)-1)*100,2)]]))+ui.card('Valeur du placement',lineChart({labels:c.map((_,i)=>'An '+i),series:[{name:'Valeur',values:c}],yMin0:true}))+ui.warn('Un fonds evergreen est valorisé régulièrement et offre des fenêtres de rachat plafonnées (« gates ») : la liquidité n’est jamais garantie et peut être suspendue. Les frais sont souvent supérieurs à 2 % par an.')}
  const calls=[],dists=[];for(let t=1;t<=v.dur;t++){const call=t<=INV?v.eng/INV:0,fee=v.eng*v.fg/100;const gt=v.eng*v.tvpi,w=t>INV?(t-INV)/(v.dur-INV):0,wp=t-1>INV?(t-1-INV)/(v.dur-INV):0;calls.push(call+fee);dists.push(gt*(w*w-wp*wp))}
  const fees=v.eng*v.fg/100*v.dur,entry=v.eng*v.fe/100,grossProfit=v.eng*v.tvpi-v.eng-fees-entry,hurdleAmt=v.eng*(Math.pow(1+v.hurdle/100,v.dur/2)-1),carry=grossProfit>hurdleAmt?(v.catch?grossProfit:grossProfit-hurdleAmt)*v.carry/100:0;
  const netTotal=v.eng*v.tvpi-carry,totalPaid=v.eng+fees+entry,netProfit=netTotal-totalPaid,tax=taxOf(netProfit),scale=netTotal/(v.eng*v.tvpi);
  const flows=[0];for(let t=1;t<=v.dur;t++)flows.push(-calls[t-1]+dists[t-1]*scale);flows[v.dur]-=tax;flows[1]-=entry;
  const cumNet=[0];flows.forEach((f,t)=>{if(t>0)cumNet.push(cumNet[t-1]+f)});const minCum=Math.min(...cumNet),be=cumNet.findIndex((x,i)=>i>0&&x>=0);
  return ui.card('',ui.kpis([['Multiple brut visé (avant frais et carried)',N(v.tvpi,2)+' x'],['Total appelé (capital + frais + droits d’entrée)',E(totalPaid)],['Frais cumulés (gestion + droits d’entrée)',E(fees+entry)],['Total distribué net de carried',E(netTotal)],['Multiple net (net TVPI)',N(netTotal/totalPaid,2)+' x','hi'],['Carried interest prélevé',E(carry)],['Impôt à la sortie',E(tax)],['TRI net d’impôt',P(irr(flows),1)],['Point bas de trésorerie (courbe en J)',E(minCum)],['Profit minimal avant carried (hurdle)',E(hurdleAmt)],['Retour à l’équilibre',be>0?'An '+be:'Jamais']]))
  +netBlock([{label:'Produit brut des cessions',value:v.eng*v.tvpi,kind:'total'},{label:'Carried interest',value:-carry,kind:'delta'},{label:'Distributions nettes',value:netTotal,kind:'total'},{label:'Capital appelé',value:-v.eng,kind:'delta'},{label:'Frais de gestion',value:-fees,kind:'delta'},{label:'Droits d’entrée',value:-entry,kind:'delta'},{label:'Résultat avant impôt',value:netProfit,kind:'total'},{label:'Impôt',value:-tax,kind:'delta'},{label:'Résultat net',value:netProfit-tax,kind:'total'}],'Du produit brut au résultat net : carried, frais et impôt')
  +ui.card('Courbe en J : trésorerie nette cumulée',lineChart({labels:cumNet.map((_,i)=>'An '+i),series:[{name:'Trésorerie cumulée nette d’impôt',values:cumNet},{name:'Zéro',values:cumNet.map(()=>0),dash:'4 4',color:'#999'}]}))
  +ui.card('Appels et distributions',ui.table(['Année','Appels + frais','Distributions brutes','Cumul net'],calls.map((c,i)=>[i+1,E(c),E(dists[i]),E(cumNet[i+1])])))
  +ui.note('Modèle pédagogique : appels linéaires pendant la période d’investissement, distributions croissantes ensuite, frais sur l’engagement pendant toute la durée, carried calculé sur le profit après frais, hurdle approximé. La dispersion réelle entre fonds est très forte. Le FCPR fiscal exige des quotas de non coté et 5 ans de détention.')},
 faq:[['Pourquoi n’ai-je pas mon argent pendant 10 ans ?','Le fonds investit dans des sociétés non cotées, revendues progressivement. L’argent n’est restitué qu’au fil des cessions.'],['Pourquoi mon capital baisse-t-il au début ?','Parce que les frais de gestion sont payés dès le début, avant les premières cessions : c’est la courbe en J.'],['Que sont les frais de gestion et le carried interest ?','Des frais annuels (ici sur l’engagement) et une part des plus-values (ici 20 %) au-delà d’un rendement minimal.'],['Quel multiple faut-il pour gagner de l’argent ?','Le multiple net doit dépasser 1 après tous les frais et l’impôt. Faites varier le curseur du multiple brut pour voir le point de bascule.'],['Fonds fermé ou evergreen ?','Le fonds fermé immobilise l’argent sur la durée du fonds ; l’evergreen propose des rachats périodiques plafonnés, sans garantie de liquidité.']],
 formulas:["<b>Appels</b> : engagement ÷ période d’investissement chaque année pendant cette période ; <b>frais de gestion</b> = engagement × taux chaque année ; droits d’entrée = engagement × taux.", "<b>Distributions</b> : produit brut × (w<sub>t</sub>² − w<sub>t−1</sub>²), avec w<sub>t</sub> = (t − période d’investissement) ÷ (durée − période), de sorte que le total égale produit brut = engagement × multiple brut.", "<b>Carried interest</b> = taux × profit (avec rattrapage) si profit ≥ hurdle, avec hurdle = engagement × ((1 + rendement préférentiel)<sup>durée ÷ 2</sup> − 1) ; sans rattrapage : taux × (profit − hurdle).", "<b>Multiple net</b> = distributions nettes de carried ÷ capital appelé (capital + frais + droits d’entrée). <b>Courbe en J</b> = somme cumulée des flux annuels nets.", "<b>TRI</b> : le taux r tel que Σ flux<sub>t</sub> ÷ (1 + r)<sup>t</sup> = 0."],
 when:{"inv": "v.type==='closed'", "tvpi": "v.type==='closed'", "fg": "v.type==='closed'", "carry": "v.type==='closed'", "hurdle": "v.type==='closed'&&v.carry>0", "catch": "v.type==='closed'&&v.carry>0", "ever_r": "v.type==='ever'"},
 watch:['Le multiple brut visé est une hypothèse : la médiane des fonds peut être très inférieure à celle des meilleurs gérants.','Tickets minimaux : FPCI 100 000 € (30 000 € dans certains cas) ; FCPR grand public de 1 000 à 10 000 € ; evergreen selon les véhicules.']});


SIMS.push({id:'alloc',grp:'Portefeuille',name:'Allocation : risque, probabilité de réussite, retraits',lead:'Compose un portefeuille, lis son risque, puis teste un plan d’épargne ou de retraits.',
 how:['Un portefeuille diversifié combine des actifs qui ne réagissent pas pareil : le risque total est <b>inférieur à la moyenne des risques</b> de chaque actif.','La part du <b>risque</b> d’une classe n’est pas sa part du capital : dans un 60/40, les actions pèsent 60 % mais apportent environ 92 % du risque.','Le <b>plan</b> (épargne ou retraits) est simulé sur 800 trajectoires : on lit la probabilité de réussir, pas une promesse.'],
 presets:[{name:'Prudent',vals:{wa:15,wo:45,wr:13,ra:6.5}},{name:'Équilibré',vals:{wa:40,wo:20,wr:20,ra:6.5}},{name:'Dynamique',vals:{wa:60,wo:12,wr:20,ra:6.5}},{name:'Offensif',vals:{wa:77,wo:5,wr:15,ra:6.5}}],
 ctl:v=>'<div class="fld" data-presets></div>'+ui.sl('wa','Actions monde',0,100,1,50,' %')+ui.sl('wo','Obligations euro',0,100,1,30,' %')+ui.sl('wr','Actifs réels et alternatifs (immobilier, infrastructure, or)',0,100,1,12,' %')+ui.help('Liquidités = complément à 100 %.')+ui.sel('rho','Corrélation actions / obligations',[[-.2,'−0,2 (désinflation)'],[.2,'+0,2 (cas central)'],[.5,'+0,5 (type 2022)']],.2)+ui.sl('ra','Rendement attendu des actions',2,12,.1,6.5,' %','Repères 10 ans : Vanguard 5,4 à 7,4 % (euro), J.P. Morgan 7,0 %, Amundi 6 à 8 %.')+ui.sl('ro','Rendement attendu des obligations',0,8,.1,3.5,' %')+ui.sl('rr','Rendement attendu des actifs réels',2,12,.1,6,' %')+ui.sl('rc','Rendement des liquidités',0,5,.1,2.5,' %','Taux de dépôt BCE : 2,50 %.')+ui.sl('fe','Frais d’entrée (capital et versements)',0,5,.05,0,' %')+ui.sl('f','Frais annuels',0,3,.05,.5,' %')+ui.sl('inf','Inflation',0,10,.1,2.5,' %')+ui.t('Plan')+ui.sl('cap','Capital de départ',0,10000000,10000,500000,' €')+ui.sl('ct','Versement annuel',0,200000,500,0,' €')+ui.sl('wd','Retrait annuel (euros constants)',0,500000,500,0,' €')+ui.sl('n','Durée',1,40,1,20,' ans')+ui.sl('target','Objectif de capital (euros constants, 0 = aucun)',0,10000000,10000,0,' €'),
 calc:v=>{const cash=100-v.wa-v.wo-v.wr;if(cash<0)return ui.warn('La somme des poids dépasse 100 % : réduis un curseur. Les liquidités sont le complément à 100 %.');
  const w=[v.wa,v.wo,v.wr,cash].map(x=>x/100),s=aaStats(w,[v.ra/100,v.ro/100,v.rr/100,v.rc/100],AA_VOL,aaCorr(v.rho)),muN=s.mu-v.f/100,muR=(1+muN)/(1+v.inf/100)-1,sh=(muN-v.rc/100)/s.sd,var95=muN-1.645*s.sd,stress=w[0]*-.30+w[1]*-.08+w[2]*-.15;
  const res=mcPaths({cap0:v.cap*(1-v.fe/100),contrib:v.ct*(1-v.fe/100),wd:v.wd,years:v.n,m:muR,s:s.sd,N:800}),res0=mcPaths({cap0:v.cap,contrib:v.ct,wd:v.wd,years:v.n,m:(1+s.mu)/(1+v.inf/100)-1,s:s.sd,N:800});
  const pT=v.target?res.paths.filter(p=>p[v.n]>=v.target).length/res.N:null,labels=res.p50.map((_,i)=>'An '+i);
  return ui.card('',ui.kpis([['Rendement brut avant frais',P(s.mu*100,2)],['Rendement nominal net de frais',P(muN*100,2)],['Rendement réel',P(muR*100,2)],['Volatilité',P(s.sd*100,2),'hi'],['Ratio de Sharpe',N(sh,2)],['VaR 95 % à 1 an',`<span class="bad">${P(var95*100,1)}</span>`],['Test de crise (actions −30 %, obligations −8 %, réels −15 %)',`<span class="bad">${P(stress*100,1)}${v.cap?' = '+E(v.cap*stress):''}</span>`],['Part du risque venant des actions',P(s.rc[0]*100,0)],v.wd?['Taux de retrait initial',P(v.wd/Math.max(1,v.cap)*100,1)]:['Versements cumulés',E(v.cap+v.ct*v.n)]]))
  +ui.card('Trajectoire du capital en euros constants (médiane, fourchette 1 sur 10)',lineChart({labels,series:[{name:'Médiane nette de frais',values:res.p50},{name:'Médiane sans frais',values:res0.p50,dash:'2 4',color:COLS[3]},...(v.target?[{name:'Objectif',values:labels.map(()=>v.target),dash:'5 4',color:COLS[2]}]:[])],band:{lo:res.p10,hi:res.p90},yMin0:true}))
  +ui.card('Résultat du plan',ui.kpis([[v.wd?'Probabilité de ne pas manquer d’argent':'Probabilité que le capital reste positif',`<span class="${res.ps>=.9?'good':res.ps>=.75?'':'bad'}">${P(res.ps*100,0)}</span>`,'hi'],['Capital final médian net de frais',E(res.p50[v.n])],['Capital final médian sans frais',E(res0.p50[v.n])],['Coût cumulé des frais (médiane)',E(Math.max(0,res0.p50[v.n]-res.p50[v.n]))],['Scénario défavorable (1 sur 10)',E(res.p10[v.n])],['Scénario favorable (1 sur 10)',E(res.p90[v.n])],...(v.target?[['Probabilité d’atteindre l’objectif',`<span class="${pT>=.8?'good':pT>=.6?'':'bad'}">${P(pT*100,0)}</span>`]]:[])]))
  +ui.card('Contribution au risque',ui.table(['Classe','Poids','Part du risque','Rendement attendu'],[['Actions monde',P(v.wa,0),P(s.rc[0]*100,0),P(v.ra,2)],['Obligations euro',P(v.wo,0),P(s.rc[1]*100,0),P(v.ro,2)],['Actifs réels et alternatifs',P(v.wr,0),P(s.rc[2]*100,0),P(v.rr,2)],['Liquidités',P(cash,0),P(s.rc[3]*100,0),P(v.rc,2)]]))
  +ui.note('Volatilités pédagogiques 15 % / 5 % / 9 % / 0,5 % ; corrélations actions-réels 0,6 et obligations-réels 0,2 ; 800 trajectoires log-normales, retraits en début d’année, graine fixe. Repère de retrait soutenable : 3,9 % (Morningstar, 30 ans, 90 % de réussite, retraits indexés ; chiffre américain).')},
 faq:[['Quel profil dois-je choisir ?','Celui que le client peut tenir en cas de baisse, pas celui qui promet le plus. Le test de crise donne la perte en euros : c’est elle qu’il faut faire valider.'],['Pourquoi la volatilité n’est-elle pas le seul risque ?','Parce que le client vit les pertes réelles et le risque de ne pas atteindre son objectif. La probabilité de réussite du plan le mesure.'],['Combien puis-je retirer chaque année ?','Le repère de 3,9 % du capital (Morningstar, 30 ans, 90 % de succès) est américain ; les pensions françaises réduisent la part à tirer du capital. Testez plusieurs retraits.'],['Que se passe-t-il si les marchés baissent au début de ma retraite ?','C’est le risque de séquence : on vend des parts à bas prix. On le gère avec un seau de liquidités pour 2 à 3 ans de retraits.'],['Les obligations protègent-elles toujours ?','Non : en 2022, hausse des taux et des prix, actions et obligations ont baissé ensemble. Changez la corrélation à +0,5 pour voir l’effet.']],
 formulas:["<b>Rendement attendu</b> = Σ poids<sub>i</sub> × rendement<sub>i</sub>. <b>Rendement net</b> = rendement − frais annuels. <b>Rendement réel</b> = (1 + rendement net) ÷ (1 + inflation) − 1.", "<b>Variance</b> = Σ<sub>i</sub> Σ<sub>j</sub> w<sub>i</sub> w<sub>j</sub> σ<sub>i</sub> σ<sub>j</sub> ρ<sub>ij</sub> ; <b>volatilité</b> = √variance.", "<b>Part du risque de la classe i</b> = w<sub>i</sub> × (Σ<sub>j</sub> w<sub>j</sub> σ<sub>i</sub> σ<sub>j</sub> ρ<sub>ij</sub>) ÷ variance. Exemple : 60 % actions à 15 %, 40 % obligations à 5 %, ρ = 0,2 → variance = 81 + 4 + 7,2 = 92,2 ; volatilité 9,6 % ; actions = 84,6 ÷ 92,2 ≈ 92 % du risque.", "<b>Ratio de Sharpe</b> = (rendement net − taux des liquidités) ÷ volatilité. <b>VaR 95 % à 1 an</b> = rendement net − 1,645 × volatilité.", "<b>Test de crise</b> = Σ poids × choc de la classe (actions −30 %, obligations −8 %, actifs réels −15 %).", "<b>Plan</b> : capital de fin d’année = (capital + versement − retrait) × (1 + g), avec g tiré selon une loi log-normale (voir « Actions »), en euros constants ; probabilité = part des 800 trajectoires où le capital reste positif."],
 watch:['Rendements et corrélations : hypothèses pédagogiques, à tester avec plusieurs jeux de valeurs.','Probabilités issues d’une simulation à graine fixe : ordres de grandeur, pas des garanties.']});


SIMS.push({id:'succession',grp:'Transmission',name:'Transmission : droits de succession, donation, assurance-vie',lead:'Combien de droits, avec quels abattements, et ce que changent une donation anticipée, le don Sarkozy et l’assurance-vie.',
 how:['Les droits dépendent du <b>lien de parenté</b> : abattement (100 000 € par enfant et par parent), puis un barème de 5 à 45 % en ligne directe. Le conjoint et le partenaire pacsé sont <b>exonérés</b>.','Une <b>donation</b> utilise l’abattement, qui se <b>renouvelle tous les 15 ans</b> : donner tôt permet de l’utiliser plusieurs fois.','Le <b>don familial de sommes d’argent</b> (« don Sarkozy », 31 865 €) s’ajoute à l’abattement, si le donateur a moins de 80 ans. L’<b>assurance-vie</b> a son propre régime : 152 500 € par bénéficiaire pour les primes versées avant 70 ans.'],
 ctl:v=>ui.seg('lien','Bénéficiaire',[['dir','Enfant (ligne directe)'],['pf','Petit-enfant'],['fs','Frère ou sœur'],['nev','Neveu ou nièce'],['tiers','Tiers']],'dir')+ui.sl('patr','Patrimoine transmis au total (hors assurance-vie)',0,20000000,10000,600000,' €')+ui.sl('nb','Nombre de bénéficiaires (parts égales)',1,10,1,2,'')+ui.sl('fn','Frais de notaire et d’actes (en % du patrimoine, à saisir)',0,5,.1,0,' %')+ui.sl('dejaDonne','Montant déjà donné à chaque bénéficiaire dans les 15 ans (consomme l’abattement)',0,1000000,1000,0,' €')+ui.t('Donation anticipée')+ui.sl('don','Donation faite maintenant (par bénéficiaire)',0,2000000,1000,100000,' €')+ui.seg('recul','Décès par rapport à la donation',[[0,'Moins de 15 ans après (rappel fiscal)'],[1,'Plus de 15 ans après (abattement renouvelé)']],0)+ui.help('Moins de 15 ans : la donation est rappelée à la succession, donc le total des droits ne change pas (seul le don familial de 31 865 € y échappe). Plus de 15 ans : l’abattement est renouvelé et la donation réduit les droits.')+ui.seg('sark','Don familial en argent (donateur de moins de 80 ans)',[[0,'Non'],[1,'Oui']],0)+ui.t('Assurance-vie (par bénéficiaire)')+ui.sl('av90','Capital décès issu des primes avant 70 ans et de tous les gains du contrat (990 I)',0,3000000,1000,0,' €','Les gains du contrat, y compris ceux des primes versées après 70 ans, relèvent de l’article 990 I.')+ui.sl('av757','Primes versées après 70 ans (757 B)',0,1000000,1000,0,' €'),
 calc:v=>{const ab={dir:100000,pf:v.lien==='pf'?1594:0,fs:15932,nev:7967,tiers:1594}[v.lien],abDon={dir:100000,pf:31865,fs:15932,nev:7967,tiers:1594}[v.lien],barLien=v.lien==='pf'?'dir':v.lien,nb=v.nb,part=v.patr/nb;
  const sarkOK=(v.lien==='dir'||v.lien==='pf')&&v.sark===1,sark=sarkOK?31865:0;
  /* Scénario A : tout à la succession (les donations des 15 dernières années consomment l'abattement) */
  const abSucc=Math.max(0,ab-v.dejaDonne),A=droitsLien(barLien,Math.max(0,part-abSucc));
  /* Scénario B : donation maintenant, le reste à la succession */
  const don=Math.min(v.don,part),abDonLeft=Math.max(0,abDon-v.dejaDonne),donTaxable=Math.max(0,don-sark-abDonLeft),dDon=droitsLien(barLien,donTaxable),reste=part-don;
  let Bfinal;

  else{const taxableTotal=Math.max(0,part-sark-abSucc);Bfinal=droitsLien(barLien,taxableTotal)}  /* moins de 15 ans : rappel fiscal, un seul abattement, seul le don Sarkozy échappe au rappel */
  /* Assurance-vie : 990 I (primes avant 70 ans) et 757 B (primes après 70 ans), par bénéficiaire */
  const t990=Math.max(0,v.av90-152500),d990=Math.min(t990,700000)*.20+Math.max(0,t990-700000)*.3125,d757=droitsLien(barLien,Math.max(0,v.av757-30500/nb));
  const tr=[];{let p=0;const base=Math.max(0,part-abSucc);for(const[l,r]of BAR_DIR){if(barLien==='dir'&&base>p){const x=Math.min(base,l)-p;tr.push([P(r*100,0),E(p)+' à '+(l===Infinity?'et plus':E(l)),E(x),E(x*r)])}p=l}}
  const taux=part>0?A/part*100:0;
  const items=[{label:'Tout à la succession',value:A*nb,color:COLS[2]},{label:'Avec donation anticipée',value:Bfinal*nb,color:COLS[0]}];
  return ui.card('',ui.kpis([['Part de chaque bénéficiaire',E(part)],['Abattement disponible (succession)',E(abSucc)],['Droits par bénéficiaire (tout à la succession)',E(A)],['Taux effectif sur la part',P(taux,1)],['Droits totaux (tout à la succession)',E(A*nb),'hi'],['Droits totaux avec donation anticipée',E(Bfinal*nb)],['Économie de la donation anticipée',`<span class="${A*nb-Bfinal*nb>=0?'good':'bad'}">${sgn(A*nb-Bfinal*nb)}</span>`],['Assurance-vie : droits par bénéficiaire (990 I + 757 B)',E(d990+d757)],['Frais de notaire et d’actes (total)',E(v.patr*v.fn/100)],['Net reçu par bénéficiaire après droits et frais',E(part-A-v.patr*v.fn/100/nb),'hi']]))
  +ui.card('Droits selon le scénario',barChart({items,aria:'Droits de succession selon le scénario'}))
  +(barLien==='dir'?ui.card('Barème en ligne directe appliqué à la part taxable',ui.table(['Taux','Tranche','Part taxable dans la tranche','Droits'],tr)):'')
