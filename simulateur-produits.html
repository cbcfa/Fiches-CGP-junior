  <div class="work"><details class="ctl" open><summary>Réglages</summary>${s.ctl()}</details><div class="out"><div class="card how"><h3>Comment ça marche</h3><ul>${s.how.map(h=>`<li>${h}</li>`).join('')}</ul></div><div id="res" class="out"></div><div id="cmp"></div><div class="card"><h3>Questions fréquentes du client</h3>${s.faq.map(q=>`<details class="q"><summary>${q[0]}</summary><p>${q[1]}</p></details>`).join('')}</div><div class="card"><h3>Points de vigilance</h3><ul>${s.watch.map(w=>`<li>${w}</li>`).join('')}</ul></div>${s.formulas?`<div class="card"><h3>Formules utilisées</h3><ul>${s.formulas.map(f=>`<li>${f}</li>`).join('')}</ul></div>`:''}<div class="card pr-only" id="prset"></div></div></div>`;
  const ctl=main.querySelector('.ctl'),res=document.getElementById('res');
  const slot=ctl.querySelector('[data-presets]');if(slot&&s.presets){slot.innerHTML=`<div class="fl"><span>Scénarios prédéfinis</span></div><div class="seg">${s.presets.map((p,i)=>`<button type="button" data-preset="${i}">${p.name}</button>`).join('')}</div>`}
  const saved=lsGet('sim2-'+id,null);if(saved)Object.entries(saved).forEach(([k,val])=>setField(ctl,k,val));
  const upd=()=>{let v=readVals(ctl);if(s.limits){applyLimits(ctl,v,s);v=readVals(ctl)}lsSet('sim2-'+id,v);applyWhen(ctl,v,s);try{res.innerHTML=s.calc(v)}catch(e){res.innerHTML=ui.warn('Calcul impossible avec ces réglages : '+e.message)}
    document.getElementById('prset').innerHTML='<h3>Réglages utilisés</h3>'+ui.table(['Paramètre','Valeur'],settingsList(ctl).map(x=>[x[0],x[1]]));renderCmp()};
  const renderCmp=()=>{const box=document.getElementById('cmp');const sn=snap[id];if(!sn){box.innerHTML='';return}
    const cur_=kpiList(res),rows=cur_.map(([l,vv])=>{const o=sn.kpis.find(x=>x[0]===l);return [l,o?o[1]:'—',vv]}),setCur=settingsList(ctl),diff=setCur.filter(([n,vv])=>{const o=sn.settings.find(x=>x[0]===n);return o&&o[1]!==vv}).map(([n,vv])=>[n,sn.settings.find(x=>x[0]===n)[1],vv]);
    box.innerHTML=ui.card('Comparaison avec le scénario mis de côté',(diff.length?ui.table(['Ce qui a changé','Scénario de côté','Scénario actuel'],diff):ui.note('Aucun réglage n’a changé depuis le scénario mis de côté.'))+ui.table(['Résultat','Scénario de côté','Scénario actuel'],rows)+`<p class="note"><button class="btn" id="bClr">Effacer le scénario de côté</button></p>`);document.getElementById('bClr').onclick=()=>{delete snap[id];renderCmp()}};
  ctl.addEventListener('input',e=>{const t=e.target;if(t.classList.contains('num')){const r=ctl.querySelector('#'+t.dataset.for),val=parseFloat(String(t.value).replace(',','.'));if(isNaN(val))return;if(val>+r.max)r.max=val;if(val<+r.min)r.min=val;r.value=val}else if(t.type==='range'){const n=ctl.querySelector(`.num[data-for="${t.id}"]`);if(n)n.value=t.value}upd()});
  ctl.addEventListener('change',e=>{if(e.target.tagName==='SELECT')upd()});
  ctl.querySelectorAll('.seg[data-seg]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{seg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');seg.querySelector('input').value=b.dataset.v;if(s.link&&s.link[seg.dataset.seg]){const m=s.link[seg.dataset.seg][b.dataset.v];if(m)Object.entries(m).forEach(([k,val])=>setField(ctl,k,val))}upd()}));
  ctl.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{const p=s.presets[+b.dataset.preset];Object.entries(p.vals).forEach(([k,val])=>setField(ctl,k,val));upd()});
  document.getElementById('bReset').onclick=()=>{try{localStorage.removeItem('sim2-'+id)}catch(e){}open(id)};
  const recapText=()=>[s.name+' — simulation du '+new Date().toLocaleDateString('fr-FR'),'','Réglages :',...settingsList(ctl).map(x=>'• '+x[0]+' : '+x[1]),'','Résultats :',...kpiList(res).map(x=>'• '+x[0]+' : '+x[1]),'','Simulation indicative, fondée sur des hypothèses et sur les règles fiscales 2026 ; elle ne constitue ni une promesse ni un conseil personnalisé.'].join('\n');
  const recapHtml=()=>`<div id="recap"><h4 style="margin:0 0 6px">${s.name}</h4><p class="note" style="margin:0 0 10px">Simulation du ${new Date().toLocaleDateString('fr-FR')} · règles fiscales 2026 · indicative</p><h4 style="margin:10px 0 4px">Réglages</h4>${ui.table(['Paramètre','Valeur'],settingsList(ctl))}<h4 style="margin:12px 0 4px">Résultats</h4>${ui.table(['Résultat','Valeur'],kpiList(res))}<p class="note">Cette simulation repose sur des hypothèses et sur les règles fiscales de 2026 ; elle ne constitue ni une promesse de résultat ni un conseil personnalisé.</p></div>`;
  const doPrint=()=>{try{window.print()}catch(e){}toast('Si l’impression ne s’ouvre pas : Ctrl+P (⌘P sur Mac), ou ouvre cette page dans un onglet séparé')};
  document.getElementById('bCopy').onclick=()=>copyText(recapText(),()=>toast('Résumé copié'),()=>showModal('Copie manuelle','<p class="note" style="margin-top:0">La copie automatique est bloquée ici : le texte est sélectionné, fais Ctrl+C (⌘C sur Mac).</p><textarea readonly rows="14" style="width:100%;font:inherit;font-size:13px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink)">'+recapText().replace(/</g,'&lt;')+'</textarea>'));
  document.getElementById('bPrint').onclick=()=>showModal('Récapitulatif à imprimer',recapHtml(),[['Imprimer',doPrint],['Copier le texte',()=>copyText(recapText(),()=>toast('Résumé copié'),()=>toast('Copie bloquée : sélectionne le texte à la main'))]]);
  document.getElementById('bSnap').onclick=()=>{snap[id]={kpis:kpiList(res),settings:settingsList(ctl)};toast('Scénario mis de côté : modifie un réglage pour comparer');renderCmp();const c=document.getElementById('cmp');if(c&&c.scrollIntoView)c.scrollIntoView({behavior:'smooth',block:'nearest'})};
  const bp=document.getElementById('bPres');bp.onclick=()=>{const on=root.classList.toggle('pres');bp.classList.toggle('on',on);bp.textContent=on?'Quitter la présentation':'Mode présentation';ctl.open=!on};
  if(root.classList.contains('pres')){bp.classList.add('on');bp.textContent='Quitter la présentation';ctl.open=false}
  upd();window.scrollTo(0,0)}
function home(){cur=null;location.hash='';buildNav();root.classList.remove('pres');
  main.innerHTML=`<div class="top"><header class="ph"><h2>Que veut comprendre ou décider le client ?</h2><p>${SIMS.length} simulateurs sur un même moteur fiscal 2026. Choisis un besoin, ou un produit dans la liste. Chaque simulateur explique son fonctionnement, se règle au centime près, affiche les valeurs brutes puis nettes de frais et d’impôt, et répond aux questions fréquentes.</p></header></div>
  <div class="needs">${NEEDS.map((n,i)=>`<button class="need" data-n="${i}"><b>${n[0]}</b><span>${n[1]}</span></button>`).join('')}</div>
  <div class="card" style="margin-top:18px"><h3>Comment utiliser en rendez-vous</h3><ul><li>Règle les paramètres avec le client : curseur ou saisie exacte du chiffre.</li><li><b>Mode présentation</b> : masque les menus et agrandit les résultats ; les réglages restent accessibles.</li><li><b>Mettre ce scénario de côté</b>, puis changer un réglage : un tableau compare les deux scénarios.</li><li><b>Copier le résumé</b> pour l’envoyer au client, ou <b>Imprimer</b> pour garder une trace des réglages utilisés.</li><li>Le registre <b>Données et sources</b> liste chaque chiffre, sa source et son statut.</li></ul></div>`;
  main.querySelectorAll('.need').forEach(b=>b.onclick=()=>open(NEEDS[+b.dataset.n][2][0]))}
function dataPage(){cur='data';location.hash='#/data';buildNav();
  main.innerHTML=`<div class="top"><header class="ph"><h2>Données et sources</h2><p>Chaque chiffre utilisé par les simulateurs, sa source et son niveau de preuve au ${DATE_V}. Les chiffres de marché (taux, rendements) bougent chaque jour : à relire le jour du rendez-vous.</p></header></div>`+ui.card('',`<div class="tw"><table class="txt"><tr><th>Domaine</th><th>Donnée</th><th>Précision</th><th>Source</th><th>Niveau de preuve</th></tr>${DATA.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="pill ${/^(Officiel|Concordant)$/.test(r[4])?'v':'c'}">${r[4]}</span></td></tr>`).join('')}</table></div>`)+ui.card('Niveaux de preuve',ui.table(['Niveau','Signification'],[['Officiel','Texte de loi, circulaire, avis, publication d’un organisme officiel (Légifrance, BOFiP, Service-Public, Banque de France, AMF, HCSF).'],['Concordant','Plusieurs sources indépendantes et récentes donnent le même chiffre ; pas de texte officiel consulté directement.'],['Fourchette','Plage de marché tirée de guides et d’offres : à remplacer par l’offre réelle de la banque ou de la société de gestion.'],['Hypothèse','Paramètre pédagogique ou libre, modifiable : ce n’est pas un fait.']]))+ui.note('Les simulations sont indicatives : elles reposent sur des hypothèses et sur les règles fiscales de 2026. Elles ne constituent ni une promesse de résultat ni un conseil personnalisé.');window.scrollTo(0,0)}
document.getElementById('logo').onclick=home;
window.addEventListener('hashchange',()=>{const id=location.hash.replace('#/','');if(id==='data'){if(cur!=='data')dataPage()}else if(id&&SIMS.find(s=>s.id===id)){if(cur!==id)open(id)}else if(!id&&cur!==null)home()});
(()=>{const id=location.hash.replace('#/','');if(id==='data')dataPage();else if(id&&SIMS.find(s=>s.id===id))open(id);else home()})();
</script></body></html>
